<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cupo-Online</title><style>:root{--b:#315cff;--g:#c8933e;--i:#172033;--m:#667085;--l:#e5e7eb}*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:var(--i);background:#fff}header{padding:15px;border-bottom:1px solid var(--l);position:sticky;top:0;background:#fff;z-index:5}.head,.wrap{max-width:1100px;margin:auto}.head{display:flex;justify-content:space-between}.brand{font-size:21px;font-weight:900}.brand span{color:var(--g)}.wrap{padding:18px 14px 50px}.card{border:1px solid var(--l);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:0 5px 20px #17203312}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{font-weight:700;display:block;margin:8px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d8dde6;border-radius:10px;font:inherit}textarea{min-height:80px}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--b);color:#fff;font-weight:700}.sec{background:#eef1f7;color:var(--i)}.danger{background:#fff0f1;color:#a22}.tag{padding:4px 8px;border-radius:99px;background:#eef1f7;font-size:12px}.ok{background:#e8f7f0;color:#16845b}.warn{background:#fff5df;color:#a36a00}.bad{background:#fff0f1;color:#b23a48}.info{background:#edf4ff;color:#315c99}.notice{padding:12px;border-radius:11px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:10px;align-items:center}details{border:1px solid var(--l);border-radius:12px;padding:10px;margin:8px 0}summary{font-weight:800;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--l);text-align:left;font-size:13px}.muted{color:var(--m)}.hero{display:grid;grid-template-columns:1fr 280px;gap:15px;align-items:center}.edu{background:#fafafa;border:1px solid var(--l);border-radius:16px;padding:8px}@media(max-width:650px const cfg={apiKey:'AIzaSyC2_YYQw-iy65JMEYj-9NIPg0uCNoTh8Fs',authDomain:'cuponline-481fe.firebaseapp.com',projectId:'cuponline-481fe',storageBucket:'cuponline-481fe.firebasestorage.app',messagingSenderId:'104604755615',appId:'1:104604755615:web:eb9e76c6db871831d064aa',measurementId:'G-C8DVZJ7E19'},fb=initializeApp(cfg),db=getFirestore(fb),auth=getAuth(fb),A=document.getElementById('app'),W=document.getElementById('who'),P=new URLSearchParams(location.search),lid=P.get('liceo'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sh=['Mañana','Tarde','Noche'],groups={Preescolar:['1er nivel','2do nivel','3er nivel'],Primaria:['1er grado','2do grado','3er grado','4to grado','5to grado','6to grado'],Secundaria:['1er año','2do año','3er año','4to año','5to año','6to año']};
const note=(x,c='info')=>`<div class="notice ${c}">${x}</div>`,code=()=>`PRE-${Date.now().toString(36).toUpperCase()}`;async function audit(t,d){try{await addDoc(collection(db,'auditoria'),{tipo:t,...d,fecha:serverTimestamp()})}catch{}}
function login(){W.textContent='Acceso';A.innerHTML=`<div class="card"><h1>Acceso</h1><label>Correo electrónico / usuario</label><input id="em" type="email"><label>Contraseña</label><input id="pw" type="password"><div class="row"><button class="btn" id="in">Iniciar sesión</button><button class="btn sec" id="new">Crear usuario</button><button class="btn sec" id="forgot">Olvidé mi contraseña</button></div><div id="m"></div></div>`;in.onclick=async()=>{try{await signInWithEmailAndPassword(auth,em.value,pw.value)}catch(e){m.innerHTML=note(esc(e.message),'bad')}};new.onclick=async()=>{try{let c=await createUserWithEmailAndPassword(auth,em.value,pw.value);await setDoc(doc(db,'usuarios',c.user.uid),{email:c.user.email,rol:'director',creado:new Date().toISOString()});m.innerHTML=note('Usuario creado. El propietario debe asociarlo al liceo.','ok')}catch(e){m.innerHTML=note(esc(e.message),'bad')}};forgot.onclick=async()=>{try{await sendPasswordResetEmail(auth,em.value);m.innerHTML=note('Proceso de recuperación enviado.','ok')}catch(e){m.innerHTML=note(esc(e.message),'bad')}}}
function publicPage(l){W.textContent='Preinscripción';let opts=Object.entries(groups).map(([g,a])=>`<optgroup label="${g}">${a.map(x=>`<option>${x}</option>`).join('')}</optgroup>`).join('');A.innerHTML=`<div class="hero card"><div><h1>Preinscripción escolar</h1><p class="muted">${esc(l.nombre||'Liceo')}</p><p>Los turnos agotados no pueden ser seleccionados.</p></div><div class="edu"><svg viewBox="0 0 280 170" width="100%"><rect x="15" y="25" width="250" height="120" rx="18" fill="#f3efe8"/><path d="M60 125V65l80-32 80 32v60M100 125V82h80v43M85 65h150" fill="none" stroke="#315cff" stroke-width="7"/><circle cx="140" cy="103" r="9" fill="#c8933e"/></svg></div></div><div class="card"><h2>Formulario de preinscripción</h2><form id="f"><div class="grid"><div><label>Nombre del estudiante</label><input id="est" required></div><div><label>Cédula del representante</label><input id="ced" required></div><div><label>Parentesco</label><input id="par" required></div><div><label>Teléfono</label><input id="tel" required></div><div><label>Correo electrónico</label><input id="mail" type="email"></div><div><label>Dirección</label><input id="dir"></div><div><label>Grado o nivel solicitado</label><select id="gr" required><option value="">Seleccione</option>${opts}</select></div><div><label>Turno solicitado</label><select id="tu" required><option value="">Seleccione</option>${sh.map(x=>`<option>${x}</option>`).join('')}<option>Cualquier turno disponible</option></select></div></div><label>Información adicional</label><textarea id="extra"></textarea><label>Documentos requeridos / comprobantes</label><input id="docs" type="file" multiple><div id="av"></div><button class="btn">Enviar preinscripción</button></form><div id="out"></div></div>`;function avail(){let g=gr.value,t=tu.value;if(!g||!t)return av.innerHTML='';let a=Array.isArray(l.cupos)?l.cupos:[];av.innerHTML=sh.map(s=>{let x=a.find(q=>q.grado===g&&q.turno===s),n=Math.max(0,(x?.cupos||0)-(x?.ocupados||0));return`<span class="tag ${n?'ok':'bad'}">${s}: ${n?`${n} cupos disponibles`:'Agotado'}</span>`}).join(' ')}gr.onchange=tu.onchange=avail;f.onsubmit=async e=>{e.preventDefault();let a=Array.isArray(l.cupos)?l.cupos:[],g=gr.value,t=tu.value,choices=t==='Cualquier turno disponible'?sh:[t],as=choices.find(s=>{let x=a.find(q=>q.grado===g&&q.turno===s);return x&&(+x.ocupados||0)<(+x.cupos||0)}),p={liceoId:lid,liceoNombre:l.nombre||'',codigo:code(),estudiante:est.value.trim(),cedulaRepresentante:ced.value.trim(),parentesco:par.value.trim(),telefono:tel.value.trim(),email:mail.value.trim(),direccion:dir.value.trim(),grado:g,turno:t,turnoAsignado:as||'',informacionAdicional:extra.value.trim(),documentos:docs.files.length,estado:as?'nueva':'Pendiente de asignación',seccion:'Pendiente de asignación',fecha:new Date().toISOString()};try{await addDoc(collection(db,'preinscripciones'),p);await audit('preinscripcion_creada',{liceoId:lid,codigo:p.codigo});A.innerHTML=`<div class="card"><h2>Comprobante de preinscripción</h2><p><b>Código:</b> ${esc(p.codigo)}</p><p><b>Estudiante:</b> ${esc(p.estudiante)}</p><p><b>Liceo:</b> ${esc(p.liceoNombre)}</p><p><b>Grado:</b> ${esc(p.grado)}</p><p><b>Turno:</b> ${esc(p.turno)}</p><p><b>Sección/Aula:</b> Pendiente de asignación</p><p><b>Fecha:</b> ${new Date(p.fecha).toLocaleString('es-ES')}</p><button class="btn" onclick="print()">Imprimir comprobante</button></div>${p.estado==='Pendiente de asignación'?note('No hay cupos disponibles para el grado y turno seleccionados. Para obtener más información, debe dirigirse al liceo y consultar con la dirección.','bad'):note('Preinscripción enviada correctamente.','ok')}`}catch(x){out.innerHTML=note(esc(x.message),'bad')}}}
async function director(u,ud){if(!ud.liceoId){A.innerHTML=note('Tu usuario todavía no está asociado a un liceo.','bad');return}onSnapshot(doc(db,'liceos',ud.liceoId),s=>{let l=s.data()||{};W.textContent='Director';A.innerHTML=`<div class="card"><div class="between"><div><h1>${esc(l.nombre)}</h1><p class="muted">Panel del director</p></div><button class="btn sec" id="out">Cerrar sesión</button></div></div><div class="card"><h2>Preinscripciones</h2><div id="pre"></div></div><div class="card"><h2>Cupos por grado y turno</h2><div id="cup"></div><button class="btn" id="save">Guardar cupos</button></div><div class="card"><h2>Mensualidad de la plataforma</h2><p>Pagos separados de los representantes.</p><button class="btn" id="mp">Pagar mensualidad de la plataforma</button><div id="pm"></div></div><div class="card"><h2>Contrato</h2><p>Contrato individual, numeración automática y versiones.</p><button class="btn" id="nc">Crear contrato</button><div id="cb"></div><div class="notice info">Debe ser revisado por un abogado antes de utilizarse como contrato legal definitivo.</div></div>`;out.onclick=()=>signOut(auth);let a=Array.isArray(l.cupos)?l.cupos:[];cup.innerHTML=a.map((x,i)=>`<details open><summary>${esc(x.grado)} — ${esc(x.turno)}</summary><div class="grid"><div><label>Grado</label><input data-i="${i}" data-k="grado" value="${esc(x.grado)}"></div><div><label>Turno</label><select data-i="${i}" data-k="turno">${sh.map(z=>`<option ${z===x.turno?'selected':''}>${z}</option>`).join('')}</select></div><div><label>Cupos</label><input type="number" data-i="${i}" data-k="cupos" value="${x.cupos||0}"></div><div><label>Ocupados</label><input type="number" data-i="${i}" data-k="ocupados" value="${x.ocupados||0}"></div></div></details>`).join('')||'<p class="muted">No hay cupos configurados.</p>';save.onclick=async()=>{a=a.map((x,i)=>({...x,grado:document.querySelector(`[data-i="${i}"][data-k="grado"]`).value,turno:document.querySelector(`[data-i="${i}"][data-k="turno"]`).value,cupos:+document.querySelector(`[data-i="${i}"][data-k="cupos"]`).value||0,ocupados:+document.querySelector(`[data-i="${i}"][data-k="ocupados"]`).value||0}));await updateDoc(doc(db,'liceos',ud.liceoId),{cupos:a});alert('Cupos guardados.')};onSnapshot(query(collection(db,'preinscripciones'),where('liceoId','==',ud.liceoId),limit(100)),s=>{pre.innerHTML=s.docs.map(d=>{let x=d.data();return`<details><summary>${esc(x.estudiante)} — ${esc(x.grado)} — ${esc(x.estado)}</summary><p>Turno: ${esc(x.turno)} · Sección: ${esc(x.seccion||'Pendiente de asignación')}</p><div class="row"><button class="btn" data-a="${d.id}">Aprobar/asignar</button><button class="btn sec" data-r="${d.id}">Devolver para corrección</button><button class="btn danger" data-x="${d.id}">Rechazar</button></div></details>`}).join('')||'<p class="muted">No hay solicitudes.</p>';s.docs.forEach(d=>{pre.querySelector(`[data-a="${d.id}"]`)?.addEventListener('click',()=>approve(d.id,d.data(),ud.liceoId,u));pre.querySelector(`[data-r="${d.id}"]`)?.addEventListener('click',()=>updateDoc(doc(db,'preinscripciones',d.id),{estado:'Devuelta para corrección'}));pre.querySelector(`[data-x="${d.id}"]`)?.addEventListener('click',async()=>{let r=prompt('Motivo del rechazo:');if(r?.trim())await updateDoc(doc(db,'preinscripciones',d.id),{estado:'rechazada',motivoRechazo:r.trim(),revisadoPor:u.uid})})})});mp.onclick=async()=>{await addDoc(collection(db,'pagosPlataforma'),{liceoId:ud.liceoId,concepto:'Mensualidad de la plataforma',estado:'Comprobante enviado',fecha:new Date().toISOString(),usuario:u.uid});pm.innerHTML=note('Comprobante enviado. Queda en revisión del propietario.','ok')};nc.onclick=async()=>{let monto=prompt('Monto final negociado:');if(monto===null)return;let r=doc(collection(db,'contratos')),n='';await runTransaction(db,async tx=>{let q=doc(db,'config','secuenciaContratos'),s=await tx.get(q),num=(s.exists()?s.data().ultimo||0:0)+1;n='CONTRATO-'+String(num).padStart(6,'0');tx.set(q,{ultimo:num},{merge:true});tx.set(r,{numero:n,version:1,liceoId:ud.liceoId,liceo:l.nombre,montoFinal:monto,estado:'Borrador pendiente de impresión',creadoPor:u.uid,fecha:new Date().toISOString()})});cb.innerHTML=note(`Contrato ${n}, Versión 1, creado como “Borrador pendiente de impresión”.`,'ok')};});}
async function approve(id,x,lid,u){let l=(await getDoc(doc(db,'liceos',lid))).data()||{},a=Array.isArray(l.cupos)?l.cupos:[],choices=x.turno==='Cualquier turno disponible'?sh:[x.turno],hit=null;for(let s of choices){let q=a.map((z,i)=>({...z,i})).filter(z=>z.grado===x.grado&&z.turno===s&&(+z.ocupados||0)<(+z.cupos||0)).sort((m,n)=>(m.ocupados||0)-(n.ocupados||0))[0];if(q){hit={...q,turno:s};break}}if(!hit){let ok=confirm('Cupo agotado. ¿Autoriza una Asignación excepcional?');if(!ok)return;let r=prompt('Razón obligatoria:');if(!r?.trim())return alert('Debe indicar la razón.');await updateDoc(doc(db,'preinscripciones',id),{estado:'confirmada',asignacionExcepcional:true,alerta:'Cupo excepcional',etiqueta:'Asignación excepcional autorizada por la dirección',motivoExcepcion:r.trim(),autorizadoPor:u.uid,fechaAsignacion:new Date().toISOString()});await audit('asignacion_excepcional',{liceoId:lid,preinscripcionId:id,estudiante:x.estudiante,razon:r});return}a[hit.i].ocupados=(+a[hit.i].ocupados||0)+1;let sec=String.fromCharCode(65+((a[hit.i].ocupados-1)%26));await updateDoc(doc(db,'liceos',lid),{cupos:a});await updateDoc(doc(db,'preinscripciones',id),{estado:'confirmada',turnoAsignado:hit.turno,seccion:sec,fechaAsignacion:new Date().toISOString(),reglaAsignacion:'menor cantidad de estudiantes / capacidad disponible',autorizadoPor:u.uid});await audit('asignacion_automatica',{liceoId:lid,preinscripcionId:id,estudiante:x.estudiante,grado:x.grado,turno:hit.turno,seccion:sec});alert('Solicitud aprobada y asignada automáticamente.')}
function owner(u){W.textContent='Propietario';A.innerHTML=`<div class="card"><div class="between"><div><h1>Panel del propietario</h1><p class="muted">Tarifas, liceos, pagos de plataforma, contratos y auditoría.</p></div><button class="btn sec" id="out">Cerrar sesión</button></div></div><div class="card"><h2>Liceos</h2><button class="btn" id="nl">Crear liceo</button><div id="ls"></div></div><div class="card"><h2>Tarifas estándar</h2><div class="grid"><input id="initial" placeholder="Cuota inicial"><input id="monthly" placeholder="Cuota mensual"><input id="grace" placeholder="Período de gracia"><input id="due" placeholder="Fecha de vencimiento"></div><button class="btn" id="st">Guardar tarifas</button></div><div class="card"><h2>Auditoría</h2><div id="au"></div></div>`;out.onclick=()=>signOut(auth);nl.onclick=async()=>{let n=prompt('Nombre del liceo:');if(n?.trim())await addDoc(collection(db,'liceos'),{nombre:n.trim(),estado:'Pendiente de revisión',cupos:[],creado:new Date().toISOString()})};st.onclick=async()=>{await setDoc(doc(db,'config','tarifas'),{inicial:initial.value,mensual:monthly.value,gracia:grace.value,vencimiento:due.value,modificadoPor:u.uid,fecha:new Date().toISOString()});alert('Tarifas guardadas.')};onSnapshot(collection(db,'liceos'),s=>ls.innerHTML=s.docs.map(d=>{let x=d.data(),link=location.origin+location.pathname+'?liceo='+d.id;return`<details><summary>${esc(x.nombre)}</summary><p>Estado: ${esc(x.estado||'Pendiente de revisión')}</p><p class="small">${esc(link)}</p><button class="btn sec" onclick="navigator.clipboard.writeText('${link}')">Copiar enlace</button></details>`}).join(''));onSnapshot(query(collection(db,'auditoria'),limit(50)),s=>au.innerHTML=s.docs.map(d=>`<div class="small">${esc(d.data().tipo)} — ${esc(JSON.stringify(d.data()))}</div>`).join(''))}
function start(){if(lid){onSnapshot(doc(db,'liceos',lid),s=>s.exists()?publicPage(s.data()):A.innerHTML=note('Liceo no encontrado.','bad'));return}onAuthStateChanged(auth,async u=>{if(!u)return login();let ud=(await getDoc(doc(db,'usuarios',u.uid))).data()||{};ud.rol==='propietario'?owner(u):director(u,ud)})}start();</script></body></html>
