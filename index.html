<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<title>Cupo-Online — Gestión educativa</title>
<style>
:root{
  --navy:#17324d;--navy2:#234b70;--gold:#c8943e;--gold2:#e7bd70;
  --green:#16805b;--green2:#e9f7f1;--red:#c0392b;--red2:#fdecea;
  --orange:#b96b08;--orange2:#fff5df;--blue:#2367a9;--blue2:#edf5fd;
  --ink:#172033;--muted:#667085;--line:#e5e7eb;--paper:#fff;--bg:#f5f7fa;
  --shadow:0 10px 30px rgba(23,50,77,.08);--radius:16px
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.2px}.brand-mark{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.wrap{max-width:1450px;margin:0 auto;padding:24px}
.hero{padding:42px 28px;background:linear-gradient(135deg,#fff,#f5f9fc);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero.cover{background-size:cover;background-position:center;color:#fff;min-height:280px;display:flex;align-items:flex-end}.hero.cover:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.72));}.hero.cover>*{position:relative;z-index:1}.hero.cover p{color:#fff}.cover-thumb{width:100%;height:170px;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block;margin-top:8px}
.hero h1{font-size:clamp(28px,4vw,48px);margin:0 0 10px}.hero p{max-width:800px;color:var(--muted);font-size:17px;line-height:1.6}
.grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card h2,.card h3{margin-top:0}.muted{color:var(--muted)}.small{font-size:13px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px}.section-title h2{margin:0}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--navy);color:#fff}.btn-gold{background:var(--gold);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-red{background:var(--red);color:#fff}.btn-light{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn-blue{background:var(--blue);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:700;color:#344054}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(35,103,169,.1)}textarea{min-height:95px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.right{margin-left:auto}
.kpi{padding:18px;border-radius:15px;border:1px solid var(--line);background:#fff}.kpi .num{font-size:30px;font-weight:850;margin:5px 0}.kpi .lbl{font-size:13px;color:var(--muted)}.kpi.green{border-top:4px solid var(--green)}.kpi.blue{border-top:4px solid var(--blue)}.kpi.gold{border-top:4px solid var(--gold)}.kpi.red{border-top:4px solid var(--red)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.b-green{background:var(--green2);color:var(--green)}.b-red{background:var(--red2);color:var(--red)}.b-orange{background:var(--orange2);color:var(--orange)}.b-blue{background:var(--blue2);color:var(--blue)}.b-gray{background:#f2f4f7;color:#475467}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:850px;background:#fff}.table th,.table td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{font-size:12px;color:#475467;background:#f8fafc;text-transform:uppercase;letter-spacing:.04em}.table tr:last-child td{border-bottom:0}
.search{position:relative}.search input{padding-left:42px}.search-icon{position:absolute;left:14px;top:11px}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:700}.tab.active{background:var(--navy);color:#fff}
.side-layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 78px)}.side{background:#102a42;color:#fff;padding:18px;position:sticky;top:78px;height:calc(100vh - 78px);overflow:auto}.side button{width:100%;text-align:left;background:transparent;border:0;color:#dbe7f2;padding:12px;border-radius:10px;margin-bottom:4px;font-weight:700}.side button.active,.side button:hover{background:rgba(255,255,255,.1);color:#fff}.main{padding:24px;min-width:0}
.logo{width:62px;height:62px;border-radius:15px;object-fit:cover;border:1px solid var(--line);background:#fff}
.grade-block{border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;background:#fff}.grade-head{padding:14px 16px;background:#f8fafc;display:flex;justify-content:space-between;gap:10px;align-items:center}.section-pill{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:120px;text-align:center}.section-grid{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px}
.turn-option{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}.turn-option.sold{opacity:.55;background:#f2f4f7}.turn-option input{accent-color:var(--navy)}
.notice{padding:12px 14px;border-radius:11px;border:1px solid #dbe4ee;background:#f7fbff;color:#284b68}.notice.warn{background:var(--orange2);border-color:#f1d69b;color:#7a4a00}.notice.error{background:var(--red2);border-color:#f0b8b1;color:#8e2a20}.notice.ok{background:var(--green2);border-color:#bfe8d8;color:#126c4c}
.modal-bg{position:fixed;inset:0;background:rgba(9,20,32,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal-bg.open{display:flex}.modal{background:#fff;width:min(1000px,100%);max-height:92vh;overflow:auto;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:0;background:#fff;z-index:2}.modal-body{padding:20px}.close{border:0;background:#f2f4f7;border-radius:9px;width:38px;height:38px;font-size:20px}
.empty{text-align:center;padding:35px;color:var(--muted)}.footer{padding:30px;text-align:center;color:var(--muted);font-size:13px}
.file-note{font-size:12px;color:var(--muted)}.divider{height:1px;background:var(--line);margin:18px 0}
.login{min-height:calc(100vh - 78px);display:grid;place-items:center;padding:24px}.login-card{width:min(460px,100%)}
.print-only{display:none}
@media(max-width:1050px){.grid-4{grid-template-columns:repeat(2,1fr)}.side-layout{grid-template-columns:1fr}.side{position:static;height:auto}.side nav{display:flex;overflow:auto}.side button{min-width:max-content;width:auto}.main{padding:16px}}
@media(max-width:700px){.wrap{padding:14px}.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.top{padding:13px 14px}.top-actions .btn-light{display:none}.hero{padding:28px 18px}.main{padding:12px}.card{padding:15px}.section-title{align-items:flex-start;flex-direction:column}.right{margin-left:0}}
@media print{body{background:#fff}.top,.side,.no-print{display:none!important}.print-only{display:block}.main{padding:0}.card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import {
  getFirestore,collection,doc,addDoc,setDoc,updateDoc,getDoc,getDocs,deleteDoc,
  onSnapshot,query,where,orderBy,runTransaction
} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
import {
  getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,
  sendPasswordResetEmail,signOut
} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
import {getStorage,ref,uploadBytes,getDownloadURL} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js';

const firebaseConfig={
  apiKey:'AIzaSyC2_YYQw-iy65JMEYj-9NIPg0uCNoTh8Fs',
  authDomain:'cuponline-481fe.firebaseapp.com',
  projectId:'cuponline-481fe',
  storageBucket:'cuponline-481fe.firebasestorage.app',
  messagingSenderId:'104604755615',
  appId:'1:104604755615:web:eb9e76c6db871831d064aa',
  measurementId:'G-C8DVZJ7E19'
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app), auth=getAuth(app), storage=getStorage(app);
const appEl=document.getElementById('app');

const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const GRADES=[
 '1er nivel','2do nivel','3er nivel',
 '1er grado','2do grado','3er grado','4to grado','5to grado','6to grado',
 '1er año','2do año','3er año','4to año','5to año','6to año'
];
const TURNS=['Mañana','Tarde'];

let currentUser=null,currentProfile=null,currentLiceoId=new URLSearchParams(location.search).get('liceo')||'';
let mode=new URLSearchParams(location.search).get('mode')||'';
let directorUnsubs=[],directorData={liceo:null,pre:[],students:[],payments:[],contracts:[]};
let ownerUnsubs=[];

const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=n=>new Intl.NumberFormat('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0);
const now=new Date();
const period=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const monthName=p=>MONTHS[Math.max(0,Number(String(p).split('-')[1])-1)]||'';
const todayISO=()=>new Date().toISOString().slice(0,10);
const toast=(msg,type='ok')=>{
  const id='toast'+Date.now(); const el=document.createElement('div');el.id=id;
  el.textContent=msg;el.style.cssText='position:fixed;right:16px;bottom:16px;z-index:300;background:'+(type==='error'?'#c0392b':type==='warn'?'#b96b08':'#17324d')+';color:#fff;padding:13px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);font-weight:700;max-width:380px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),3800);
};
function openModal(title,body){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg open" id="modalBg"><div class="modal"><div class="modal-head"><strong>${title}</strong><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div></div></div>`;
}
window.closeModal=()=>document.getElementById('modalRoot').innerHTML='';
window.logout=async()=>{await signOut(auth);location.href=location.pathname+(currentLiceoId?'?liceo='+encodeURIComponent(currentLiceoId):'')};

function shell(content,title='Cupo-Online'){
  appEl.innerHTML=`<div class="top"><div class="brand"><div class="brand-mark">CO</div><div>${esc(title)}<div class="small" style="font-weight:500;opacity:.8">Gestión educativa</div></div></div><div class="top-actions"><button class="btn btn-light" onclick="location.href='${location.pathname}${currentLiceoId?'?liceo='+encodeURIComponent(currentLiceoId):''}'">Inicio</button>${currentUser?'<button class="btn btn-light" onclick="logout()">Cerrar sesión</button>':''}</div></div>${content}`;
}

async function getLiceo(id){
  const s=await getDoc(doc(db,'liceos',id));return s.exists()?{id:s.id,...s.data()}:null;
}

function portalHome(){
  shell(`<div class="wrap"><div class="hero"><h1>Cupo-Online</h1><p>Plataforma integral para preinscripciones, cupos, alumnos, secciones, documentos y mensualidades escolares.</p><div class="actions"><button class="btn btn-primary" onclick="showPublicLiceo()">Preinscripción</button><button class="btn btn-light" onclick="showDirectorLogin()">Acceso del director</button><button class="btn btn-light" onclick="showOwnerLogin()">Acceso administrativo</button></div></div><div class="grid grid-3" style="margin-top:18px"><div class="card"><h3>Preinscripción</h3><p class="muted">El representante registra los datos y recibe su comprobante.</p></div><div class="card"><h3>Gestión escolar</h3><p class="muted">El director administra alumnos, cupos, secciones y documentos.</p></div><div class="card"><h3>Mensualidades</h3><p class="muted">Control mensual automático y comprobantes de pago.</p></div></div></div>`);
}
window.showPublicLiceo=async()=>{
  const id=prompt('Introduce el código del liceo para preinscribirte:');if(!id)return;
  const l=await getLiceo(id.trim());if(!l){toast('No se encontró ese liceo','error');return}
  location.href=location.pathname+'?liceo='+encodeURIComponent(id.trim());
};

function loginCard(role){
  shell(`<div class="login"><div class="card login-card"><h2>${role==='owner'?'Acceso administrativo':'Acceso del director'}</h2><p class="muted">${role==='owner'?'Gestiona los liceos y sus suscripciones.':'Gestiona el liceo, preinscripciones, alumnos y pagos.'}</p><div class="field"><label>Correo electrónico</label><input id="loginEmail" type="email" autocomplete="email" placeholder="correo@ejemplo.com"></div><div class="field"><label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••"></div><div class="actions"><button class="btn btn-primary" onclick="login('${role}')">Iniciar sesión</button><button class="btn btn-light" onclick="portalHome()">Volver</button><button class="btn btn-light" onclick="resetPass()">Olvidé mi contraseña</button></div><div id="loginMsg" style="margin-top:12px"></div></div></div>`);
}
window.showDirectorLogin=()=>loginCard('director');window.showOwnerLogin=()=>loginCard('owner');
window.resetPass=async()=>{const e=document.getElementById('loginEmail')?.value.trim();if(!e||!e.includes('@'))return toast('Escribe un correo electrónico válido','warn');try{await sendPasswordResetEmail(auth,e);toast('Revisa tu correo para restablecer la contraseña')}catch(err){toast(firebaseError(err),'error')}};
window.login=async role=>{
 const e=document.getElementById('loginEmail').value.trim(),p=document.getElementById('loginPass').value;
 if(!e||!e.includes('@'))return toast('El acceso utiliza correo electrónico. Introduce un correo válido.','warn');
 if(!p)return toast('Escribe tu contraseña','warn');
 try{await signInWithEmailAndPassword(auth,e,p);currentUser=auth.currentUser;await routeAfterAuth(role)}
 catch(err){document.getElementById('loginMsg').innerHTML='<div class="notice error">'+esc(firebaseError(err))+'</div>'}
};
function firebaseError(err){
 const c=err?.code||'';
 const map={'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/invalid-login-credentials':'Correo o contraseña incorrectos.','auth/user-not-found':'No existe una cuenta con ese correo.','auth/wrong-password':'Contraseña incorrecta.','auth/invalid-email':'El correo electrónico no es válido.','auth/email-already-in-use':'Ese correo ya está registrado.','auth/weak-password':'La contraseña debe tener al menos 6 caracteres.','permission-denied':'No tienes permisos para realizar esta operación.'};
 return map[c]||err?.message||'Ocurrió un error.';
}

async function routeAfterAuth(expectedRole){
 if(!auth.currentUser)return;
 const s=await getDoc(doc(db,'usuarios',auth.currentUser.uid));
 if(!s.exists()){await signOut(auth);toast('La cuenta no tiene un perfil autorizado.','error');return}
 currentProfile=s.data();currentUser=auth.currentUser;
 if(currentProfile.rol==='owner'&&expectedRole==='owner'){ownerView();return}
 if(currentProfile.rol==='director'&&expectedRole==='director'&&currentProfile.liceoId){
   currentLiceoId=currentProfile.liceoId;location.href=location.pathname+'?liceo='+encodeURIComponent(currentLiceoId)+'&mode=director';return
 }
 await signOut(auth);toast('La cuenta no tiene el rol autorizado para este acceso.','error');
}

async let publicUnsub=null;
function renderPublic(id){
 if(publicUnsub){publicUnsub();publicUnsub=null}
 publicUnsub=onSnapshot(doc(db,'liceos',id),s=>{
  if(!s.exists()){shell(`<div class="wrap"><div class="card"><h2>Liceo no encontrado</h2><p>Verifica el código de preinscripción.</p><button class="btn btn-primary" onclick="portalHome()">Volver</button></div></div>`);return}
  const l={id:s.id,...s.data()},cover=l.portada||l.fotoPortada||l.fotoPerfil||l.logo||'';
  const heroClass=cover?'hero cover':'hero',heroStyle=cover?` style="background-image:url('${esc(cover)}')"`:'';
  shell(`<div class="wrap"><div class="${heroClass}"${heroStyle}><div class="actions"><img class="logo" src="${esc(l.logo||l.fotoPerfil||'')}" onerror="this.style.display='none'"><div><h1 style="margin:0">${esc(l.nombre||'Liceo')}</h1><p>${esc(l.descripcion||'Portal oficial de preinscripción')}</p></div></div></div><div style="margin-top:18px">${publicForm(l)}</div><div class="footer">Cupo-Online · Portal de preinscripción · Disponibilidad actualizada en tiempo real</div></div>`,l.nombre||'Preinscripción');
 },e=>shell(`<div class="wrap"><div class="card"><h2>No se pudo cargar el liceo</h2><p>${esc(e?.message||'Verifica la conexión con Firebase.')}</p><button class="btn btn-primary" onclick="portalHome()">Volver</button></div></div>`));
}
function publicForm(l){
 const cups=l.cupos||[];
 const availableGrades=[...new Set(cups.map(x=>x.grado).filter(Boolean))];
 const grades=availableGrades.length?availableGrades:GRADES;
 return `<div class="card"><h2>Solicitud de preinscripción</h2><div class="notice">Completa los datos del alumno y su representante. El sistema admite <strong>educación inicial (1er, 2do y 3er nivel)</strong>, educación primaria y educación media. El turno <strong>Mañana</strong> o <strong>Tarde</strong> se selecciona aquí. Cuando un turno o sección se quede sin cupos, aparecerá automáticamente como <strong>AGOTADO</strong>. Si se aumenta la capacidad, volverá a estar disponible automáticamente.</div>
 <form id="preForm" onsubmit="submitPre(event,'${esc(l.id)}')">
 <div class="section-title"><h3>Datos del alumno</h3></div><div class="grid grid-3">
 <div class="field"><label>Nombre *</label><input name="nombre" required></div><div class="field"><label>Apellidos *</label><input name="apellidos" required></div><div class="field"><label>Cédula del alumno</label><input name="cedula" placeholder="Si no tiene, déjalo vacío"></div>
 <div class="field"><label>Fecha de nacimiento *</label><input name="fechaNacimiento" type="date" required></div>
 <div class="field"><label>Grado solicitado *</label><select name="grado" id="preGrade" onchange="refreshTurnOptions('${esc(l.id)}')" required><option value="">Seleccionar</option>${grades.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div>
 </div>
 <div class="section-title"><h3>Turno solicitado</h3></div><div id="turnOptions" class="grid grid-2"><div class="notice">Primero selecciona el grado.</div></div>
 <div class="section-title"><h3>Datos del representante</h3></div><div class="grid grid-3">
 <div class="field"><label>Nombre completo *</label><input name="representante" required></div><div class="field"><label>Cédula del representante *</label><input name="cedulaRepresentante" required></div><div class="field"><label>Parentesco *</label><input name="parentesco" placeholder="Madre, padre, tutor..." required></div>
 <div class="field"><label>Teléfono *</label><input name="telefono" required></div><div class="field"><label>Correo electrónico *</label><input name="correo" type="email" required></div><div class="field"><label>Dirección *</label><input name="direccion" required></div>
 </div>
 <div class="section-title"><h3>Información adicional</h3></div><div class="field"><label>Información adicional</label><textarea name="info" placeholder="Observaciones, necesidades de horario, etc."></textarea></div>
 <div class="section-title"><h3>Documentos</h3></div><div class="grid grid-2">
 <div class="field"><label>Cédula del alumno</label><input name="docCedula" type="file" accept=".pdf,.jpg,.jpeg,.png"></div>
 <div class="field"><label>Partida de nacimiento</label><input name="docPartida" type="file" accept=".pdf,.jpg,.jpeg,.png"></div>
 <div class="field"><label>Documento del representante</label><input name="docRep" type="file" accept=".pdf,.jpg,.jpeg,.png"></div>
 <div class="field"><label>Otros documentos</label><input name="docOtros" type="file" accept=".pdf,.jpg,.jpeg,.png"></div>
 </div>
 <div class="field"><label><input type="checkbox" name="acepto" required> Confirmo que la información suministrada es correcta.</label></div>
 <div class="actions"><button class="btn btn-primary" id="preSubmit">Enviar preinscripción</button></div>
 </form></div>`;
}
window.refreshTurnOptions=async liceoId=>{
 const grade=document.getElementById('preGrade')?.value,box=document.getElementById('turnOptions');if(!grade||!box)return;
 const l=await getLiceo(liceoId),cups=(l?.cupos||[]).filter(x=>x.grado===grade);
 box.innerHTML=TURNS.map(turn=>{
  const rows=cups.filter(x=>x.turn===turn),cap=rows.reduce((a,x)=>a+Number(x.capacidad||x.total||0),0),occ=rows.reduce((a,x)=>a+Number(x.ocupados||0),0);
  const avail=Math.max(0,cap-occ),configured=rows.length>0,exhausted=configured&&avail<=0;
  const status=exhausted?'AGOTADO':configured?avail+' cupo(s) disponible(s)':'Disponible';
  return `<label class="turn-option ${exhausted?'sold':''}"><span><strong>${turn}</strong><br><span class="small">${status}</span></span><input type="radio" name="turn" value="${turn}" ${exhausted?'disabled':''} required></label>`;
 }).join('');
};

function sectionChoice(grade,turn){
 const cups=(directorData.liceo.cupos||[]).filter(x=>x.grado===grade&&x.turn===turn);
 return cups.map((x,i)=>{const cap=Number(x.capacidad||x.total||0),occ=Number(x.ocupados||0),left=Math.max(0,cap-occ);return {x,i,left,cap,occ}}).sort((a,b)=>a.occ-b.occ);
}
async function chooseAutoSection(grade,turn){
 const choices=sectionChoice(grade,turn).filter(o=>o.left>0);
 if(!choices.length)throw new Error('No quedan secciones disponibles para ese grado y turno.');
 return choices[0];
}
window.approvePre=async id=>{
 const p=directorData.pre.find(x=>x.id===id);if(!p)return;
 try{
  const choice=await chooseAutoSection(p.grado,p.turn);
  if(!confirm(`Se asignará automáticamente ${choice.x.seccion||choice.x.salon||'la primera sección disponible'} para ${p.nombre} ${p.apellidos}. ¿Continuar?`))return;
  const liceoRef=doc(db,'liceos',currentLiceoId),preRef=doc(db,'preinscripciones',id),studentRef=doc(collection(db,'estudiantes'));
  const l=directorData.liceo,fee=Number(l.mensualidadEstudiante||0),year=new Date().getFullYear(),student={id:studentRef.id,liceoId:currentLiceoId,preinscripcionId:id,code:'ALU-'+year+'-'+studentRef.id.slice(-7).toUpperCase(),nombre:p.nombre,apellidos:p.apellidos,nombreCompleto:p.nombre+' '+p.apellidos,cedula:p.cedula||'',fechaNacimiento:p.fechaNacimiento||'',representante:p.representante,cedulaRepresentante:p.cedulaRepresentante,parentesco:p.parentesco,telefono:p.telefono,correo:p.correo,direccion:p.direccion,grado:p.grado,turn:p.turn,seccion:choice.x.seccion||choice.x.salon||'A',salon:choice.x.salon||'',estado:'Activo',mensualidad:fee,anioEscolar:year,creado:Date.now(),actualizado:Date.now()};
  await runTransaction(db,async tx=>{
    const ls=await tx.get(liceoRef),ld=ls.data()||{},cups=[...(ld.cupos||[])],idx=cups.findIndex(x=>x.grado===p.grado&&x.turn===p.turn&&(x.seccion||x.salon||'A')===(choice.x.seccion||choice.x.salon||'A'));
    if(idx<0)throw new Error('La sección ya no está disponible. Actualiza y vuelve a intentar.');
    const cap=Number(cups[idx].capacidad||cups[idx].total||0),occ=Number(cups[idx].ocupados||0);if(occ>=cap)throw new Error('El cupo acaba de agotarse.');
    cups[idx]={...cups[idx],ocupados:occ+1};tx.update(liceoRef,{cupos:cups,actualizado:Date.now()});tx.set(studentRef,student);tx.update(preRef,{estado:'Aprobada',asignacion:student.seccion,studentId:student.id,aprobada:Date.now()});
  });
  await createStudentYearPayments(student,l);
  toast(`Alumno aprobado. Asignado a ${student.seccion}.`);
  closeModal();
 }catch(e){toast(e.message||firebaseError(e),'error')}
};

async function createStudentYearPayments(s,l){
 const fee=Number(s.mensualidad||0),year=s.anioEscolar||new Date().getFullYear(),dueDay=Math.min(28,Math.max(1,Number(l.diaVencimientoMensualidad||10)));
 for(let m=1;m<=12;m++){
   const per=`${year}-${String(m).padStart(2,'0')}`,id=`${s.id}_${per}`;
   await setDoc(doc(db,'pagosMensuales',id),{id,liceoId:s.liceoId,estudianteId:s.id,periodo:per,mes:MONTHS[m-1],anio:year,monto:fee,fechaVencimiento:`${per}-${String(dueDay).padStart(2,'0')}`,estado:'Pendiente',creado:Date.now()},{merge:true});
 }
}

window.savePayment=async id=>{const data={estado:'Pagado',monto:Number(document.getElementById('payAmount').value)||0,fechaPago:document.getElementById('payDate').value,metodo:document.getElementById('payMethod').value,referencia:document.getElementById('payRef').value.trim(),actualizado:Date.now()};await updateDoc(doc(db,'pagosMensuales',id),data);closeModal();toast('Pago registrado correctamente');};

function docsPage(){
 const incomplete=directorData.students.filter(s=>!s.documentosCompletos);
 return `<div class="grid grid-3"><div class="kpi blue"><div class="lbl">Alumnos</div><div class="num">${directorData.students.length}</div></div><div class="kpi gold"><div class="lbl">Con revisión pendiente</div><div class="num">${incomplete.length}</div></div><div class="kpi green"><div class="lbl">Documentos</div><div class="num">Centralizados</div></div></div><div class="card" style="margin-top:16px"><h2>Control documental</h2><p class="muted">Cada alumno conserva su información y los documentos asociados a su preinscripción.</p>${directorData.students.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Alumno</th><th>Grado</th><th>Estado documental</th><th></th></tr></thead><tbody>${directorData.students.map(s=>`<tr><td>${esc(s.nombreCompleto)}</td><td>${esc(s.grado)}</td><td>${s.documentosCompletos?'<span class="badge b-green">Completo</span>':'<span class="badge b-orange">Revisar</span>'}</td><td><button class="btn btn-light" onclick="studentFicha('${s.id}')">Abrir ficha</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay alumnos.</div>'}</div>`;
}
function reportsPage(){
 const active=directorData.students.filter(s=>s.estado==='Activo'),byGrade={};active.forEach(s=>(byGrade[s.grado]??=0,byGrade[s.grado]++));
 return `<div class="grid grid-2"><div class="card"><h2>Alumnos por grado</h2>${Object.entries(byGrade).map(([g,n])=>`<div class="actions" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(g)}</span><strong class="right">${n}</strong></div>`).join('')||'<div class="empty">Sin datos.</div>'}</div><div class="card"><h2>Herramientas</h2><div class="actions"><button class="btn btn-primary" onclick="exportStudentsCSV()">Exportar alumnos CSV</button><button class="btn btn-light" onclick="printStudentList()">Imprimir listado</button></div><div class="divider"></div><p class="muted">Los reportes usan los datos del liceo que tiene el director autorizado.</p></div></div>`;
}
window.exportStudentsCSV=()=>{
 const rows=[['Código','Nombre','Cédula','Grado','Sección','Turno','Representante','Cédula representante','Teléfono','Correo','Estado'],...directorData.students.map(s=>[s.code,s.nombreCompleto,s.cedula,s.grado,s.seccion,s.turn,s.representante,s.cedulaRepresentante,s.telefono,s.correo,s.estado])];
 const csv=rows.map(r=>r.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\\n'),blob=new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='alumnos-cupo-online.csv';a.click();URL.revokeObjectURL(url);
};
window.printStudentList=()=>{const old=document.body.innerHTML;document.body.innerHTML='<div style="padding:30px"><h1>'+esc(directorData.liceo.nombre)+'</h1><h2>Listado de alumnos</h2>'+studentsTable(directorData.students)+'</div>';window.print();document.body.innerHTML=old;location.reload()};

function settingsPage(){
 const l=directorData.liceo||{};const cover=l.portada||l.fotoPortada||l.fotoPerfil||l.logo||"";return `<div class="card"><h2>Configuración del liceo</h2><div class="notice">La foto de portada que subas aquí aparecerá automáticamente en el perfil público del liceo.</div><div class="grid grid-2"><div class="field"><label>Nombre</label><input id="setNombre" value="${esc(l.nombre||'')}"></div><div class="field"><label>Teléfono</label><input id="setTelefono" value="${esc(l.telefono||'')}"></div><div class="field"><label>Correo</label><input id="setCorreo" type="email" value="${esc(l.email||'')}"></div><div class="field"><label>Dirección</label><input id="setDireccion" value="${esc(l.direccion||'')}"></div><div class="field"><label>Mensualidad del alumno</label><input id="setFee" type="number" min="0" step="0.01" value="${Number(l.mensualidadEstudiante||0)}"></div><div class="field"><label>Día de vencimiento mensual</label><input id="setDue" type="number" min="1" max="28" value="${Number(l.diaVencimientoMensualidad||10)}"></div><div class="field"><label>Descripción</label><textarea id="setDesc">${esc(l.descripcion||'')}</textarea></div><div class="field"><label>Logo URL</label><input id="setLogo" value="${esc(l.logo||'')}"></div><div class="field"><label>Foto de portada del liceo</label><input id="setPortada" type="file" accept="image/*"><span class="file-note">Puedes cambiarla cuando quieras. Se verá en el perfil público.</span></div></div>${cover?`<img class="cover-thumb" src="${esc(cover)}" onerror="this.style.display='none'">`:``}<div class="actions" style="margin-top:12px"><button class="btn btn-primary" onclick="saveSettings()">Guardar configuración</button><button class="btn btn-light" onclick="openPublicProfile()">Ver perfil público</button></div></div><div class="card" style="margin-top:16px"><h2>Cupos y secciones</h2><p class="muted">Configura grado, turno, sección y capacidad. Cuando una sección llegue a su capacidad, el portal público la mostrará como agotada.</p><div class="actions"><button class="btn btn-gold" onclick="addCapacity()">Agregar sección</button></div><div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>Grado</th><th>Turno</th><th>Sección</th><th>Capacidad</th><th>Ocupados</th><th>Disponibles</th><th>Estado</th><th></th></tr></thead><tbody>${(l.cupos||[]).map((x,i)=>{const cap=Number(x.capacidad||x.total||0),occ=Number(x.ocupados||0),avail=Math.max(0,cap-occ);return `<tr><td>${esc(x.grado)}</td><td>${esc(x.turn)}</td><td>${esc(x.seccion||x.salon||'')}</td><td>${cap}</td><td>${occ}</td><td><strong>${avail}</strong></td><td>${avail<=0?'<span class="badge b-red">AGOTADO</span>':'<span class="badge b-green">Disponible</span>'}</td><td><button class="btn btn-red" onclick="deleteCapacity(${i})">Eliminar</button></td></tr>`}).join('')||'<tr><td colspan="8">No hay secciones configuradas.</td></tr>'}</tbody></table></div></div>`;
}
window.openPublicProfile=()=>{location.href=location.pathname+'?liceo='+encodeURIComponent(currentLiceoId)};
window.saveSettings=async()=>{const f=document.getElementById('setPortada')?.files?.[0];let portada=null;if(f)portada=await uploadFile(f,'liceos/'+currentLiceoId+'/portada');const data={nombre:document.getElementById('setNombre').value.trim(),telefono:document.getElementById('setTelefono').value.trim(),email:document.getElementById('setCorreo').value.trim(),direccion:document.getElementById('setDireccion').value.trim(),mensualidadEstudiante:Number(document.getElementById('setFee').value)||0,diaVencimientoMensualidad:Math.min(28,Math.max(1,Number(document.getElementById('setDue').value)||10)),descripcion:document.getElementById('setDesc').value.trim(),logo:document.getElementById('setLogo').value.trim(),actualizado:Date.now()};if(portada)data.portada=portada;await updateDoc(doc(db,'liceos',currentLiceoId),data);toast('Configuración guardada');if(portada)directorData.liceo={...directorData.liceo,...data};};
window.addCapacity=async()=>{openModal('Agregar sección',`<div class="grid grid-2"><div class="field"><label>Grado / nivel</label><select id="capGrade"><optgroup label="Educación inicial">${GRADES.slice(0,3).map(g=>`<option>${g}</option>`).join('')}</optgroup><optgroup label="Educación primaria">${GRADES.slice(3,9).map(g=>`<option>${g}</option>`).join('')}</optgroup><optgroup label="Educación media">${GRADES.slice(9).map(g=>`<option>${g}</option>`).join('')}</optgroup></select></div><div class="field"><label>Turno</label><select id="capTurn"><option>Mañana</option><option>Tarde</option></select></div><div class="field"><label>Sección</label><input id="capSec" placeholder="A"></div><div class="field"><label>Capacidad</label><input id="capN" type="number" min="1" value="25"></div></div><button class="btn btn-primary" onclick="saveCapacity()">Guardar sección</button>`)};
window.saveCapacity=async()=>{const l=directorData.liceo,cups=[...(l.cupos||[])];cups.push({grado:document.getElementById('capGrade').value,turn:document.getElementById('capTurn').value,seccion:document.getElementById('capSec').value.trim().toUpperCase()||'A',capacidad:Number(document.getElementById('capN').value)||25,ocupados:0});await updateDoc(doc(db,'liceos',currentLiceoId),{cupos:cups,actualizado:Date.now()});closeModal();toast('Sección agregada')};
window.deleteCapacity=async i=>{const cups=[...(directorData.liceo.cupos||[])];if(Number(cups[i].ocupados||0)>0)return toast('No puedes eliminar una sección que ya tiene alumnos.','warn');if(!confirm('¿Eliminar esta sección?'))return;cups.splice(i,1);await updateDoc(doc(db,'liceos',currentLiceoId),{cupos});toast('Sección eliminada')};

window.editStudent=id=>{
 const s=directorData.students.find(x=>x.id===id);if(!s)return;
 openModal('Editar alumno',`<div class="grid grid-2"><div class="field"><label>Nombre</label><input id="esNombre" value="${esc(s.nombre||'')}"></div><div class="field"><label>Apellidos</label><input id="esApellidos" value="${esc(s.apellidos||'')}"></div><div class="field"><label>Cédula</label><input id="esCedula" value="${esc(s.cedula||'')}"></div><div class="field"><label>Representante</label><input id="esRep" value="${esc(s.representante||'')}"></div><div class="field"><label>Cédula representante</label><input id="esRepCed" value="${esc(s.cedulaRepresentante||'')}"></div><div class="field"><label>Teléfono</label><input id="esTel" value="${esc(s.telefono||'')}"></div><div class="field"><label>Correo</label><input id="esMail" value="${esc(s.correo||'')}"></div><div class="field"><label>Dirección</label><input id="esDir" value="${esc(s.direccion||'')}"></div></div><button class="btn btn-primary" onclick="saveStudentEdit('${id}')">Guardar cambios</button>`);
};
window.saveStudentEdit=async id=>{await updateDoc(doc(db,'estudiantes',id),{nombre:document.getElementById('esNombre').value.trim(),apellidos:document.getElementById('esApellidos').value.trim(),nombreCompleto:document.getElementById('esNombre').value.trim()+' '+document.getElementById('esApellidos').value.trim(),cedula:document.getElementById('esCedula').value.trim(),representante:document.getElementById('esRep').value.trim(),cedulaRepresentante:document.getElementById('esRepCed').value.trim(),telefono:document.getElementById('esTel').value.trim(),correo:document.getElementById('esMail').value.trim(),direccion:document.getElementById('esDir').value.trim(),actualizado:Date.now()});closeModal();toast('Ficha actualizada')};
window.deactivateStudent=async id=>{if(!confirm('¿Marcar este alumno como inactivo?'))return;await updateDoc(doc(db,'estudiantes',id),{estado:'Inactivo',actualizado:Date.now()});closeModal();toast('Alumno marcado como inactivo')};
window.openManualStudent=()=>openModal('Agregar alumno',`<p class="muted">Usa esta opción para registrar directamente un alumno que ya fue admitido. Después de guardarlo se crearán automáticamente sus 12 mensualidades del año.</p><div class="grid grid-2"><div class="field"><label>Nombre</label><input id="mn"></div><div class="field"><label>Apellidos</label><input id="ma"></div><div class="field"><label>Cédula</label><input id="mc"></div><div class="field"><label>Grado / nivel</label><select id="mg"><optgroup label="Educación inicial">${GRADES.slice(0,3).map(g=>`<option>${g}</option>`).join('')}</optgroup><optgroup label="Educación primaria">${GRADES.slice(3,9).map(g=>`<option>${g}</option>`).join('')}</optgroup><optgroup label="Educación media">${GRADES.slice(9).map(g=>`<option>${g}</option>`).join('')}</optgroup></select></div><div class="field"><label>Turno</label><select id="mt"><option>Mañana</option><option>Tarde</option></select></div><div class="field"><label>Sección</label><input id="ms" value="A"></div><div class="field"><label>Representante</label><input id="mr"></div><div class="field"><label>Cédula representante</label><input id="mrc"></div><div class="field"><label>Teléfono</label><input id="mrt"></div></div><button class="btn btn-primary" onclick="saveManualStudent()">Guardar alumno</button>`);
window.saveManualStudent=async()=>{
 const id=doc(collection(db,'estudiantes')).id,l=directorData.liceo,year=new Date().getFullYear(),n=document.getElementById('mn').value.trim(),a=document.getElementById('ma').value.trim();
 const s={id,liceoId:currentLiceoId,code:'ALU-'+year+'-'+id.slice(-7).toUpperCase(),nombre:n,apellidos:a,nombreCompleto:n+' '+a,cedula:document.getElementById('mc').value.trim(),grado:document.getElementById('mg').value,turn:document.getElementById('mt').value,seccion:document.getElementById('ms').value.trim().toUpperCase()||'A',representante:document.getElementById('mr').value.trim(),cedulaRepresentante:document.getElementById('mrc').value.trim(),telefono:document.getElementById('mrt').value.trim(),estado:'Activo',mensualidad:Number(l.mensualidadEstudiante||0),anioEscolar:year,creado:Date.now(),actualizado:Date.now()};
 await setDoc(doc(db,'estudiantes',id),s);await createStudentYearPayments(s,l);closeModal();toast('Alumno creado y mensualidades generadas');
};

async function ownerView(){
 const snap=await getDocs(collection(db,'liceos'));const liceos=snap.docs.map(d=>({id:d.id,...d.data()}));
 shell(`<div class="wrap"><div class="section-title"><div><h1>Administración de Cupo-Online</h1><p class="muted">Liceos, suscripciones y configuración comercial.</p></div><button class="btn btn-primary" onclick="createLiceo()">Agregar liceo</button></div><div class="grid grid-3">${liceos.map(l=>`<div class="card"><div class="actions"><div><h2 style="margin:0">${esc(l.nombre)}</h2><div class="small muted">${esc(l.email||'')}</div></div><span class="badge ${l.estado==='Activo'?'b-green':'b-gray'}">${esc(l.estado||'Activo')}</span></div><div class="divider"></div><p>${esc(l.direccion||'')}</p><p><b>Mensualidad plataforma:</b> $${money(l.mensualidadPlataforma||0)}</p><div class="actions"><button class="btn btn-light" onclick="editLiceo('${l.id}')">Editar</button><button class="btn btn-light" onclick="ownerContract('${l.id}')">Contrato</button><button class="btn btn-red" onclick="deleteLiceo('${l.id}')">Eliminar</button></div></div>`).join('')||'<div class="card empty">No hay liceos registrados.</div>'}</div></div>`);
}
window.createLiceo=()=>openModal('Nuevo liceo',`<div class="grid grid-2"><div class="field"><label>Nombre *</label><input id="nl"></div><div class="field"><label>Correo</label><input id="ne" type="email"></div><div class="field"><label>Teléfono</label><input id="nt"></div><div class="field"><label>Dirección</label><input id="nd"></div><div class="field"><label>Mensualidad de plataforma</label><input id="np" type="number" min="0" step="0.01" value="50"></div><div class="field"><label>Mensualidad del alumno</label><input id="ns" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Foto de portada del liceo</label><input id="nf" type="file" accept="image/*"></div></div><button class="btn btn-primary" onclick="saveNewLiceo()">Crear liceo</button>`);
window.saveNewLiceo=async()=>{const r=await addDoc(collection(db,'liceos'),{nombre:document.getElementById('nl').value.trim(),email:document.getElementById('ne').value.trim(),telefono:document.getElementById('nt').value.trim(),direccion:document.getElementById('nd').value.trim(),mensualidadPlataforma:Number(document.getElementById('np').value)||0,mensualidadEstudiante:Number(document.getElementById('ns').value)||0,diaVencimientoMensualidad:10,estado:'Activo',cupos:[],creado:Date.now()});const f=document.getElementById('nf')?.files?.[0];if(f){const portada=await uploadFile(f,'liceos/'+r.id+'/portada');await updateDoc(doc(db,'liceos',r.id),{portada,actualizado:Date.now()})}closeModal();toast('Liceo creado. Código: '+r.id);ownerView()};
window.editLiceo=async id=>{const l=await getLiceo(id);openModal('Editar liceo',`<div class="grid grid-2"><div class="field"><label>Nombre</label><input id="elN" value="${esc(l.nombre)}"></div><div class="field"><label>Correo</label><input id="elE" value="${esc(l.email||'')}"></div><div class="field"><label>Teléfono</label><input id="elT" value="${esc(l.telefono||'')}"></div><div class="field"><label>Dirección</label><input id="elD" value="${esc(l.direccion||'')}"></div><div class="field"><label>Mensualidad plataforma</label><input id="elP" type="number" value="${Number(l.mensualidadPlataforma||0)}"></div><div class="field"><label>Estado</label><select id="elS"><option ${l.estado==='Activo'?'selected':''}>Activo</option><option ${l.estado==='Inactivo'?'selected':''}>Inactivo</option></select></div><div class="field"><label>Foto de portada del liceo</label><input id="elF" type="file" accept="image/*"></div></div><button class="btn btn-primary" onclick="saveLiceoEdit('${id}')">Guardar cambios</button>`)};
window.saveLiceoEdit=async id=>{const data={nombre:document.getElementById('elN').value.trim(),email:document.getElementById('elE').value.trim(),telefono:document.getElementById('elT').value.trim(),direccion:document.getElementById('elD').value.trim(),mensualidadPlataforma:Number(document.getElementById('elP').value)||0,estado:document.getElementById('elS').value,actualizado:Date.now()};const f=document.getElementById('elF')?.files?.[0];if(f)data.portada=await uploadFile(f,'liceos/'+id+'/portada');await updateDoc(doc(db,'liceos',id),data);closeModal();ownerView();toast('Liceo actualizado')};
window.deleteLiceo=async id=>{if(!confirm('Esta acción eliminará el registro del liceo. ¿Continuar?'))return;await deleteDoc(doc(db,'liceos',id));toast('Liceo eliminado');ownerView()};
window.ownerContract=async id=>{const l=await getLiceo(id);openModal('Contrato de servicio',`<div id="contract"><h1>${esc(l.nombre)}</h1><p>Servicio de gestión educativa Cupo-Online.</p><p><b>Suscripción mensual:</b> $${money(l.mensualidadPlataforma||0)}</p><p>El servicio contempla gestión de preinscripciones, alumnos, cupos, secciones, documentos y mensualidades.</p><p class="muted">Este documento es una plantilla administrativa y debe revisarse antes de firmarse.</p></div><button class="btn btn-primary" onclick="window.print()">Imprimir / Guardar PDF</button>`)};

function subscribeDirector(){
 directorUnsubs.forEach(u=>u());directorUnsubs=[];
 directorUnsubs.push(onSnapshot(doc(db,'liceos',currentLiceoId),s=>{if(s.exists()){directorData.liceo={id:s.id,...s.data()};if(document.getElementById('directorContent'))directorPage('inicio')}}));
 directorUnsubs.push(onSnapshot(query(collection(db,'preinscripciones'),where('liceoId','==',currentLiceoId)),s=>{directorData.pre=s.docs.map(d=>({id:d.id,...d.data()}));if(document.getElementById('directorContent'))directorPage('inicio')}));
 directorUnsubs.push(onSnapshot(query(collection(db,'estudiantes'),where('liceoId','==',currentLiceoId)),s=>{directorData.students=s.docs.map(d=>({id:d.id,...d.data()}));if(document.getElementById('directorContent'))directorPage('inicio')}));
 directorUnsubs.push(onSnapshot(query(collection(db,'pagosMensuales'),where('liceoId','==',currentLiceoId)),s=>{directorData.payments=s.docs.map(d=>({id:d.id,...d.data()}));if(document.getElementById('directorContent'))directorPage('inicio')}));
}

async function renderDirector(){
 const l=await getLiceo(currentLiceoId);if(!l){portalHome();toast('Liceo no encontrado','error');return}
 directorData.liceo=l;directorLayout('inicio');subscribeDirector();
}
async function boot(){
 const qs=new URLSearchParams(location.search);
 currentLiceoId=qs.get('liceo')||'';mode=qs.get('mode')||'';
 if(mode==='director'){
   onAuthStateChanged(auth,async u=>{currentUser=u;if(u){const s=await getDoc(doc(db,'usuarios',u.uid));if(s.exists()&&s.data().rol==='director'&&s.data().liceoId===currentLiceoId){currentProfile=s.data();renderDirector()}else{await signOut(auth);showDirectorLogin()}}else showDirectorLogin()});
   return;
 }
 if(currentLiceoId){renderPublic(currentLiceoId);return}
 if(auth.currentUser){const s=await getDoc(doc(db,'usuarios',auth.currentUser.uid));if(s.exists()&&s.data().rol==='owner'){ownerView();return}}
 portalHome();
}
boot();
</script>
</body>
</html>
