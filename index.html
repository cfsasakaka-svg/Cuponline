<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuponline — Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF6EE; --ink:#1C2536; --ink-soft:#5B6472; --gold:#C8933E; --gold-soft:#EFDBB2;
  --green:#2F6F4E; --green-soft:#DCEBE1; --red:#B3452F; --red-soft:#F3DED7; --line:#DAD2C0; --card:#FFFFFF;
  --shadow:0 1px 2px rgba(28,37,54,.04), 0 6px 20px -10px rgba(28,37,54,.16);
  --r:7px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#14161C; --ink:#EDEAE1; --ink-soft:#A7A192; --card:#1E212B; --line:#333644; }
}
:root[data-theme="dark"]{ --paper:#14161C; --ink:#EDEAE1; --ink-soft:#A7A192; --card:#1E212B; --line:#333644; }
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.5;}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0;}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 60px;}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--paper);box-shadow:0 1px 0 rgba(28,37,54,.02), 0 4px 14px -10px rgba(28,37,54,.18);}
.wordmark{display:flex;align-items:center;gap:9px;font-family:'Fraunces',serif;font-weight:600;font-size:1.12rem;}
.wordmark svg{flex:none;}
.wordmark span{color:var(--gold);}
.pill{font-size:0.74rem;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card);}
h1.page{font-size:1.6rem;margin:32px 0 4px;}
.sub{color:var(--ink-soft);font-size:0.92rem;margin-bottom:24px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:34px;}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:16px 18px;box-shadow:var(--shadow);}
.card b{display:block;font-family:'Fraunces',serif;font-size:1.6rem;}
.card span{color:var(--ink-soft);font-size:0.82rem;}
.liceo-row{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:14px 16px;margin-bottom:10px;flex-wrap:wrap;box-shadow:var(--shadow);}
.liceo-row .name{font-weight:500;}
.liceo-row .meta{color:var(--ink-soft);font-size:0.84rem;}
.btn{font-family:inherit;font-size:0.88rem;font-weight:500;padding:9px 16px;border-radius:var(--r);border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;text-decoration:none;display:inline-block;transition:opacity .15s ease, transform .1s ease;}
.btn:hover{opacity:.88;}
.btn:active{transform:translateY(1px);}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.sm{padding:6px 12px;font-size:0.8rem;}
input,select,textarea{font-family:inherit;font-size:0.92rem;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);transition:border-color .15s ease;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
table{width:100%;border-collapse:collapse;font-size:0.88rem;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);}
th{text-align:left;color:var(--ink-soft);font-weight:500;font-size:0.76rem;text-transform:none;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper);}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:rgba(200,147,62,.05);}
.badge{font-size:0.76rem;padding:3px 9px;border-radius:999px;display:inline-block;}
.badge.nueva{background:var(--gold-soft);color:#8A5F1C;}
.badge.contactada{background:#E4E7EE;color:#3B4460;}
.badge.confirmada{background:var(--green-soft);color:var(--green);}
.badge.rechazada{background:var(--red-soft);color:var(--red);}
.section{margin-top:38px;}
.section h2{font-size:1.15rem;margin-bottom:14px;}
.formrow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:520px;margin-bottom:12px;}
.formrow .full{grid-column:1/-1;}
.formrow label{font-size:0.78rem;color:var(--ink-soft);display:block;margin-bottom:4px;}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.linkbox code{font-family:inherit;background:var(--gold-soft);color:#7A551C;padding:5px 10px;border-radius:6px;font-size:0.82rem;font-weight:500;}
.empty{color:var(--ink-soft);font-size:0.9rem;padding:22px 18px;border:1px dashed var(--line);border-radius:var(--r);background:rgba(0,0,0,.008);}
.msg{font-size:0.85rem;padding:10px 14px;border-radius:6px;margin-bottom:16px;}
.msg.ok{background:var(--green-soft);color:var(--green);}
.msg.warn{background:var(--gold-soft);color:#8A5F1C;}
</style>
</head>
<body>
<header>
  <div class="wordmark">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3L2 8L12 13L22 8L12 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6 10.5V16C6 16 8.5 18.5 12 18.5C15.5 18.5 18 16 18 16V10.5" stroke="#C8933E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Cupon<span>line</span>
  </div>
  <span class="pill" id="whoami">Cargando…</span>
</header>
<div class="wrap">
  <div id="app"><p class="empty">Cargando panel…</p></div>
</div>

<script type="module">
/* =========================================================================
   BASE DE DATOS — conectada a tu proyecto de Firebase "Cuponline"
   Todo lo que se guarda aquí vive en tu Firestore, no en Claude ni en
   este navegador: cualquiera que abra el link, desde cualquier
   dispositivo, ve y escribe los mismos datos en tiempo real.
   ========================================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection as fsCollection, doc as fsDoc,
  addDoc, updateDoc, onSnapshot, query, where as fsWhere
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC2_YYQw-iy65JMEYj-9NIPg0uCNoTh8Fs",
  authDomain: "cuponline-481fe.firebaseapp.com",
  projectId: "cuponline-481fe",
  storageBucket: "cuponline-481fe.firebasestorage.app",
  messagingSenderId: "104604755615",
  appId: "1:104604755615:web:eb9e76c6db871831d064aa",
  measurementId: "G-C8DVZJ7E19"
};
const firebaseApp = initializeApp(firebaseConfig);
const firestore = getFirestore(firebaseApp);

function createFirebaseDB(){
  function toDocs(snap){ return snap.docs.map(d=>({id:d.id, data:()=>d.data()})); }
  function collection(name){
    const colRef = fsCollection(firestore, name);
    return {
      add: (obj)=> addDoc(colRef, obj),
      doc: (id)=>({ update: (patch)=> updateDoc(fsDoc(firestore, name, id), patch) }),
      onSnapshot: (cb)=> onSnapshot(colRef, snap=>cb({docs:toDocs(snap)})),
      where: (field, op, val)=>{
        const q = query(colRef, fsWhere(field, op, val));
        return { onSnapshot: (cb)=> onSnapshot(q, snap=>cb({docs:toDocs(snap)})) };
      }
    };
  }
  function doc(path){
    const [name, id] = path.split('/');
    const ref = fsDoc(firestore, name, id);
    return {
      update: (patch)=> updateDoc(ref, patch),
      onSnapshot: (cb)=> onSnapshot(ref, snap=>cb({exists: snap.exists(), id: snap.id, data:()=>snap.data()||{}}))
    };
  }
  return { collection, doc };
}

const params = new URLSearchParams(location.search);
const liceoId = params.get('liceo');
const app = document.getElementById('app');
const whoami = document.getElementById('whoami');

function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts){ if(!ts) return ''; try{ return new Date(ts).toLocaleDateString('es-VE', {day:'2-digit',month:'short'}); }catch(e){ return ''; } }

async function boot(){
  const db = createFirebaseDB();
  const adminToken = params.get('admin');

  if(!liceoId){
    whoami.textContent = 'Dueño (modo local)';
    renderOwnerView(db);
    return;
  }

  // Hay ?liceo= en el link: puede ser el link público o el del director.
  const liceoDoc = db.doc('liceos/'+liceoId);
  let routed = false;
  liceoDoc.onSnapshot(doc=>{
    if(routed) return;
    if(!doc.exists){
      whoami.textContent='';
      app.innerHTML = '<p class="empty">Ese link no es válido. Verifica que lo hayas copiado completo.</p>';
      return;
    }
    routed = true;
    const esDirector = adminToken && adminToken === doc.data().adminToken;
    if(esDirector){
      whoami.textContent = 'Panel del director';
      renderDirectorView(db, liceoId);
    } else {
      whoami.textContent = 'Preinscripción';
      renderPublicView(db, liceoId, doc.data());
    }
  });
}

// ---------- OWNER VIEW ----------
function renderOwnerView(db){
  const liceos = db.collection('liceos');
  const preins = db.collection('preinscripciones');
  let liceosData = [], preinsData = [];

  function paint(){
    const totalNuevas = preinsData.filter(p=>p.data.estado==='nueva').length;
    const totalConfirmadas = preinsData.filter(p=>p.data.estado==='confirmada').length;

    let liceosHtml = liceosData.length ? liceosData.map(l=>{
      const mine = preinsData.filter(p=>p.data.liceoId===l.id);
      const nuevas = mine.filter(p=>p.data.estado==='nueva').length;
      const linkPublico = location.origin + location.pathname + '?liceo=' + l.id;
      const linkDirector = linkPublico + '&admin=' + l.data.adminToken;
      return `<div class="liceo-row" style="flex-direction:column;align-items:stretch;">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <div class="name">${esc(l.data.nombre)}</div>
          <div class="meta">${mine.length} preinscripciones · ${nuevas} nuevas</div>
        </div>
        <div class="linkbox" style="margin-top:8px;">
          <span class="meta" style="min-width:70px;">Público:</span>
          <code>${esc(linkPublico)}</code>
          <button class="btn sm ghost" onclick="navigator.clipboard.writeText('${linkPublico}');this.textContent='Copiado';setTimeout(()=>this.textContent='Copiar',1200)">Copiar</button>
          <a class="btn sm ghost" href="${esc(linkPublico)}" target="_blank" rel="noopener">Abrir</a>
        </div>
        <div class="linkbox" style="margin-top:6px;">
          <span class="meta" style="min-width:70px;">Director:</span>
          <code>${esc(linkDirector)}</code>
          <button class="btn sm ghost" onclick="navigator.clipboard.writeText('${linkDirector}');this.textContent='Copiado';setTimeout(()=>this.textContent='Copiar',1200)">Copiar</button>
          <a class="btn sm ghost" href="${esc(linkDirector)}" target="_blank" rel="noopener">Abrir</a>
        </div>
      </div>`;
    }).join('') : '<p class="empty">Aún no tienes liceos registrados. Crea el primero abajo.</p>';

    let tablaHtml = preinsData.length ? `<table><thead><tr><th>Niño</th><th>Liceo</th><th>Grado</th><th>Representante</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>
      ${preinsData.slice().sort((a,b)=>(b.data.creado||0)-(a.data.creado||0)).map(p=>{
        const l = liceosData.find(x=>x.id===p.data.liceoId);
        return `<tr><td>${esc(p.data.nino)}</td><td>${esc(l?l.data.nombre:'—')}</td><td>${esc(p.data.grado)}</td><td>${esc(p.data.representante)}</td><td><span class="badge ${esc(p.data.estado)}">${esc(p.data.estado)}</span></td><td>${fmtDate(p.data.creado)}</td></tr>`;
      }).join('')}
    </tbody></table>` : '<p class="empty">Todavía no hay preinscripciones registradas.</p>';

    app.innerHTML = `
      <h1 class="page">Panel general</h1>
      <p class="sub">Monitorea todos los liceos afiliados a Cuponline.</p>
      <div class="grid">
        <div class="card"><b>${liceosData.length}</b><span>liceos afiliados</span></div>
        <div class="card"><b>${preinsData.length}</b><span>preinscripciones totales</span></div>
        <div class="card"><b>${totalNuevas}</b><span>sin contactar</span></div>
        <div class="card"><b>${totalConfirmadas}</b><span>matrículas confirmadas</span></div>
      </div>

      <div class="section">
        <h2>Liceos afiliados</h2>
        ${liceosHtml}
        <div style="margin-top:14px;">
          <input id="nuevo-liceo-nombre" placeholder="Nombre del nuevo liceo" style="min-width:220px;">
          <button class="btn sm" id="btn-crear-liceo">+ Crear liceo</button>
        </div>
        <p id="owner-msg"></p>
      </div>

      <div class="section">
        <h2>Todas las preinscripciones</h2>
        ${tablaHtml}
      </div>
    `;

    document.getElementById('btn-crear-liceo').onclick = async ()=>{
      const nombre = document.getElementById('nuevo-liceo-nombre').value.trim();
      if(!nombre) return;
      const msg = document.getElementById('owner-msg');
      try{
        await liceos.add({ nombre, cupos: [], adminToken: Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6), creado: Date.now() });
        document.getElementById('nuevo-liceo-nombre').value='';
      }catch(e){
        msg.innerHTML = '<span class="msg warn">No se pudo crear el liceo. Intenta de nuevo.</span>';
      }
    };
  }

  liceos.onSnapshot(snap=>{ liceosData = snap.docs.map(d=>({id:d.id, data:d.data()})); paint(); });
  preins.onSnapshot(snap=>{ preinsData = snap.docs.map(d=>({id:d.id, data:d.data()})); paint(); });
}

// ---------- VISTA DEL DIRECTOR ----------
function renderDirectorView(db, id){
  const liceoDoc = db.doc('liceos/'+id);
  const preins = db.collection('preinscripciones');
  let liceo = null, preinsData = [];

  async function setEstado(pid, nuevoEstado){
    const p = preinsData.find(x=>x.id===pid);
    if(!p) return;
    const updates = { estado: nuevoEstado };
    if(nuevoEstado === 'confirmada' && !p.data.cupoDescontado){
      updates.cupoDescontado = true;
      const cupos = (liceo.data.cupos||[]).map(c => c.grado===p.data.grado ? {...c, ocupados:(c.ocupados||0)+1} : c);
      await liceoDoc.update({ cupos });
    }
    await preins.doc(pid).update(updates);
  }

  function paint(){
    if(!liceo){ app.innerHTML = '<p class="empty">Ese liceo no existe o el link no es válido.</p>'; return; }
    const cupos = liceo.data.cupos || [];
    const cuposHtml = cupos.length ? `<table><thead><tr><th>Grado</th><th>Cupos totales</th><th>Ocupados</th><th>Disponibles</th></tr></thead><tbody>
      ${cupos.map((c,i)=>`<tr><td>${esc(c.grado)}</td><td>${c.total}</td><td>${c.ocupados||0}</td><td>${Math.max(c.total-(c.ocupados||0),0)}</td></tr>`).join('')}
    </tbody></table>` : '<p class="empty">Aún no has definido cupos por grado.</p>';

    const rowsHtml = preinsData.length ? preinsData.slice().sort((a,b)=>(b.data.creado||0)-(a.data.creado||0)).map(p=>`
      <tr>
        <td>${esc(p.data.nino)}</td><td>${esc(p.data.grado)}</td><td>${esc(p.data.turno||'—')}</td>
        <td>${esc(p.data.representante)}<br><span class="meta" style="color:var(--ink-soft);font-size:0.78rem;">${esc(p.data.telefono)}</span></td>
        <td>
          <select onchange="window.__setEstado('${p.id}', this.value)">
            ${['nueva','contactada','confirmada','rechazada'].map(e=>`<option value="${e}" ${p.data.estado===e?'selected':''}>${e}</option>`).join('')}
          </select>
        </td>
        <td>${fmtDate(p.data.creado)}</td>
      </tr>`).join('') : `<tr><td colspan="6" class="empty">Sin preinscripciones todavía.</td></tr>`;

    const link = location.origin + location.pathname + '?liceo=' + id;

    app.innerHTML = `
      <h1 class="page">${esc(liceo.data.nombre)}</h1>
      <p class="sub linkbox">Link público para publicitar (compártelo con los padres): <code>${esc(link)}</code>
        <button class="btn sm ghost" onclick="navigator.clipboard.writeText('${link}');this.textContent='Copiado';setTimeout(()=>this.textContent='Copiar',1200)">Copiar</button>
        <a class="btn sm ghost" href="${esc(link)}" target="_blank" rel="noopener">Abrir</a>
      </p>

      <div class="section">
        <h2>Cupos por grado</h2>
        ${cuposHtml}
        <div class="formrow" style="margin-top:10px;">
          <div><label>Grado</label><input id="cupo-grado" placeholder="Ej. 3er grado"></div>
          <div><label>Cupos totales</label><input id="cupo-total" type="number" min="0"></div>
        </div>
        <button class="btn sm" id="btn-add-cupo">+ Agregar / actualizar grado</button>
      </div>

      <div class="section">
        <h2>Preinscripciones recibidas</h2>
        <table><thead><tr><th>Niño</th><th>Grado</th><th>Turno</th><th>Representante</th><th>Estado</th><th>Fecha</th></tr></thead>
        <tbody>${rowsHtml}</tbody></table>
      </div>

      <div class="section">
        <h2>Registrar preinscripción manual</h2>
        <p class="sub" style="margin-bottom:14px;">Para anotar una que llegó por WhatsApp, teléfono o en persona.</p>
        <div class="formrow">
          <div><label>Nombre del niño</label><input id="f-nino"></div>
          <div><label>Grado</label><input id="f-grado"></div>
          <div><label>Turno</label>
            <select id="f-turno"><option value="">Sin preferencia</option><option>Mañana</option><option>Tarde</option></select>
          </div>
          <div><label>Representante</label><input id="f-representante"></div>
          <div><label>Teléfono</label><input id="f-telefono"></div>
          <div><label>Correo (opcional)</label><input id="f-correo"></div>
          <div class="full"><label>Notas</label><textarea id="f-notas" rows="2"></textarea></div>
        </div>
        <button class="btn sm" id="btn-add-preins">+ Registrar</button>
        <p id="liceo-msg"></p>
      </div>
    `;

    document.getElementById('btn-add-cupo').onclick = async ()=>{
      const grado = document.getElementById('cupo-grado').value.trim();
      const total = parseInt(document.getElementById('cupo-total').value, 10);
      if(!grado || isNaN(total)) return;
      const existentes = (liceo.data.cupos||[]).filter(c=>c.grado!==grado);
      await liceoDoc.update({ cupos: [...existentes, {grado, total, ocupados: (liceo.data.cupos||[]).find(c=>c.grado===grado)?.ocupados || 0}] });
    };

    document.getElementById('btn-add-preins').onclick = async ()=>{
      const nino = document.getElementById('f-nino').value.trim();
      const grado = document.getElementById('f-grado').value.trim();
      const representante = document.getElementById('f-representante').value.trim();
      const telefono = document.getElementById('f-telefono').value.trim();
      const msg = document.getElementById('liceo-msg');
      if(!nino || !grado || !representante || !telefono){
        msg.innerHTML = '<span class="msg warn">Faltan campos obligatorios (niño, grado, representante, teléfono).</span>';
        return;
      }
      try{
        await preins.add({
          liceoId: id, nino, grado, representante, telefono,
          turno: document.getElementById('f-turno').value,
          correo: document.getElementById('f-correo').value.trim(),
          notas: document.getElementById('f-notas').value.trim(),
          estado: 'nueva', creado: Date.now()
        });
        ['f-nino','f-grado','f-representante','f-telefono','f-correo','f-notas'].forEach(fid=>document.getElementById(fid).value='');
        document.getElementById('f-turno').value='';
        msg.innerHTML = '<span class="msg ok">Preinscripción registrada.</span>';
      }catch(e){
        msg.innerHTML = '<span class="msg warn">No se pudo registrar. Intenta de nuevo.</span>';
      }
    };
  }

  window.__setEstado = setEstado;
  liceoDoc.onSnapshot(doc=>{ liceo = doc.exists ? {id:doc.id, data:doc.data()} : null; paint(); });
  preins.where('liceoId','==',id).onSnapshot(snap=>{ preinsData = snap.docs.map(d=>({id:d.id, data:d.data()})); paint(); });
}

// ---------- VISTA PÚBLICA (preinscripción) ----------
function renderPublicView(db, id, liceoData){
  const preins = db.collection('preinscripciones');

  app.innerHTML = `
    <h1 class="page">Preinscripción — ${esc(liceoData.nombre)}</h1>
    <p class="sub">Completa los datos de tu representado. El liceo revisará tu solicitud y te contactará.</p>

    <form id="preform" style="max-width:560px;">
      <div class="formrow">
        <div><label>Nombre del niño/a *</label><input id="p-nino" required></div>
        <div><label>Grado al que aspira *</label><input id="p-grado" placeholder="Ej. 3er grado" required></div>
        <div><label>Turno preferido</label>
          <select id="p-turno"><option value="">Sin preferencia</option><option>Mañana</option><option>Tarde</option></select>
        </div>
        <div><label>Nombre del representante *</label><input id="p-representante" required></div>
        <div><label>Teléfono / WhatsApp *</label><input id="p-telefono" type="tel" placeholder="04XX-XXXXXXX" required></div>
        <div><label>Correo (opcional)</label><input id="p-correo" type="email"></div>
        <div class="full"><label>Notas (opcional)</label><textarea id="p-notas" rows="2"></textarea></div>
      </div>
      <button type="submit" class="btn">Enviar preinscripción</button>
      <p id="pub-msg" style="margin-top:12px;"></p>
    </form>

    <div id="pub-confirm" style="display:none;max-width:560px;">
      <div class="card" style="border-color:var(--green);">
        <h3 style="color:var(--green);font-size:1.1rem;margin-bottom:6px;">Preinscripción recibida</h3>
        <p class="sub" style="margin:0;" id="pub-confirm-text"></p>
      </div>
    </div>
  `;

  document.getElementById('preform').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const nino = document.getElementById('p-nino').value.trim();
    const grado = document.getElementById('p-grado').value.trim();
    const representante = document.getElementById('p-representante').value.trim();
    const telefono = document.getElementById('p-telefono').value.trim();
    if(!nino || !grado || !representante || !telefono) return;

    await preins.add({
      liceoId: id, nino, grado, representante, telefono,
      turno: document.getElementById('p-turno').value,
      correo: document.getElementById('p-correo').value.trim(),
      notas: document.getElementById('p-notas').value.trim(),
      estado: 'nueva', creado: Date.now()
    });

    document.getElementById('pub-confirm-text').textContent =
      `Gracias, ${representante}. Recibimos la preinscripción de ${nino} para ${liceoData.nombre}. Te contactarán al ${telefono}.`;
    document.getElementById('preform').style.display = 'none';
    document.getElementById('pub-confirm').style.display = 'block';
  });
}

boot();
</script>
</body>
</html>
