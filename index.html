<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cupo-Online — Gestión educativa</title>
<style>
:root{--paper:#fff;--ink:#172033;--muted:#667085;--line:#e5e7eb;--card:#fff;--gold:#c8933e;--green:#23734d;--greenSoft:#e4f3eb;--red:#b42318;--redSoft:#fdecea;--orange:#b54708;--orangeSoft:#fff1e6;--blue:#175cd3;--blueSoft:#eff8ff;--shadow:0 8px 30px rgba(16,24,40,.07);--r:12px}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem}.brand span{color:var(--gold)}.wrap{max-width:1180px;margin:auto;padding:0 18px 60px}.page{font-size:1.8rem;margin:28px 0 5px}.sub{color:var(--muted);margin:0 0 20px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding:28px 0}.hero h1{font-size:2.4rem;line-height:1.1;margin:0 0 10px}.liceoPhoto{width:120px;height:120px;object-fit:cover;border-radius:18px;border:1px solid #e5e7eb;margin:8px 0}.heroImg{background:#f7fbff;border:1px solid #dbeafe;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.heroImg svg{display:block;width:100%;height:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}.card b{display:block;font-size:1.55rem}.section{margin-top:30px}.section h2{font-size:1.2rem;margin:0 0 12px}.btn{font:inherit;font-weight:700;border:1px solid #172033;background:#172033;color:#fff;border-radius:9px;padding:10px 15px;cursor:pointer;text-decoration:none;display:inline-block}.btn:hover{opacity:.9}.btn.ghost{background:#fff;color:#172033;border-color:var(--line)}.btn.green{background:var(--green);border-color:var(--green)}.btn.red{background:var(--red);border-color:var(--red)}.btn.sm{padding:7px 10px;font-size:.84rem}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px}.formrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:850px}.formrow .full{grid-column:1/-1}.field label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:5px;font-weight:600}input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:2px solid #dbeafe;border-color:#84adff}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.86rem}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f8fafc;color:var(--muted);font-size:.76rem}tr:last-child td{border-bottom:0}.badge{display:inline-block;border-radius:999px;padding:3px 9px;font-size:.74rem;font-weight:700}.badge.green{background:var(--greenSoft);color:var(--green)}.badge.red{background:var(--redSoft);color:var(--red)}.badge.orange{background:var(--orangeSoft);color:var(--orange)}.badge.blue{background:var(--blueSoft);color:var(--blue)}.badge.gray{background:#f2f4f7;color:#475467}.notice{padding:11px 13px;border-radius:9px;margin:10px 0;font-size:.88rem}.notice.ok{background:var(--greenSoft);color:var(--green)}.notice.warn{background:var(--orangeSoft);color:var(--orange)}.notice.err{background:var(--redSoft);color:var(--red)}.notice.info{background:var(--blueSoft);color:var(--blue)}details{border:1px solid var(--line);border-radius:10px;background:#fff;margin:8px 0;padding:0 12px}summary{cursor:pointer;font-weight:700;padding:12px 2px}.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.linkbox code{background:#f8fafc;padding:5px 8px;border-radius:6px;word-break:break-all}.empty{padding:20px;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;padding:15px;z-index:30}.modal{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.hide{display:none!important}.contract{font-family:Georgia,serif;line-height:1.65}.contract h2{text-align:center}.contract .contractHead{text-align:center;border-bottom:1px solid #bbb;padding-bottom:12px;margin-bottom:15px}.qr{background:#fff;padding:8px;border:1px solid var(--line);display:inline-block}.small{font-size:.78rem;color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;cursor:pointer}.tab.active{background:#172033;color:#fff;border-color:#172033}@media(max-width:760px){.hero{grid-template-columns:1fr}.hero h1{font-size:1.9rem}.formrow{grid-template-columns:1fr}.formrow .full{grid-column:auto}table{display:block;overflow-x:auto;white-space:nowrap}.page{font-size:1.5rem}}
@media print{header,.noPrint{display:none!important}body{background:#fff}.wrap{max-width:none}.contract{font-size:12pt}}
</style>
</head>
<body>
<header><div class="brand">🎓 <span style="color:#172033">Cupo-</span><span>Online</span></div><div id="whoami" class="pill">Cargando…</div></header>
<div class="wrap"><div id="app"><div class="empty">Cargando…</div></div></div>
<div id="modalRoot"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import {getFirestore,collection,doc,addDoc,updateDoc,setDoc,getDoc,onSnapshot,query,where,orderBy,runTransaction} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail,signOut} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
import {getStorage,ref,uploadBytes,getDownloadURL} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js';
const firebaseConfig={apiKey:'AIzaSyC2_YYQw-iy65JMEYj-9NIPg0uCNoTh8Fs',authDomain:'cuponline-481fe.firebaseapp.com',projectId:'cuponline-481fe',storageBucket:'cuponline-481fe.firebasestorage.app',messagingSenderId:'104604755615',appId:'1:104604755615:web:eb9e76c6db871831d064aa',measurementId:'G-C8DVZJ7E19'};
const fb=initializeApp(firebaseConfig),db=getFirestore(fb),auth=getAuth(fb),storage=getStorage(fb);const app=document.getElementById('app'),who=document.getElementById('whoami');
const params=new URLSearchParams(location.search),liceoId=params.get('liceo'),mode=params.get('mode');
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-VE',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(Number(n||0));
const dateText=x=>x?new Date(x).toLocaleString('es-VE'):'—';
const today=()=>new Date().toISOString();
function publicLink(id){return location.origin+location.pathname+'?liceo='+encodeURIComponent(id)}
function qrUrl(url){return 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(url)}
function notice(t,c='info'){return `<div class="notice ${c}">${esc(t)}</div>`}
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}window.closeModal=()=>document.getElementById('modalRoot').innerHTML='';
async function audit(liceoId,action,details={}){try{await addDoc(collection(db,'auditoria'),{liceoId:liceoId||null,accion:action,detalles,usuario:auth.currentUser?.email||'sistema',uid:auth.currentUser?.uid||null,fecha:Date.now()})}catch(e){console.warn('auditoria',e)}}
async function uploadFile(file,path){if(!file)return null;const r=ref(storage,path+'/'+Date.now()+'_'+file.name.replace(/[^\w.\-]/g,'_'));await uploadBytes(r,file);return getDownloadURL(r)}

const GRADES=[{name:'Preescolar',items:['1er nivel','2do nivel','3er nivel']},{name:'Primaria',items:['1er grado','2do grado','3er grado','4to grado','5to grado','6to grado']},{name:'Secundaria',items:['1er año','2do año','3er año','4to año','5to año','6to año']}];
function gradeOptions(selected=''){return GRADES.map(g=>`<optgroup label="${g.name}">${g.items.map(x=>`<option ${x===selected?'selected':''}>${x}</option>`).join('')}</optgroup>`).join('')}
function gradePicker(id,selected=''){return `<select id="${id}"><option value="">Selecciona grado o nivel</option>${gradeOptions(selected)}</select>`}

function portalHome(){who.textContent='Portal';app.innerHTML=`<section class="hero"><div><div class="pill">Gestión educativa</div><h1>Cupo-Online</h1><p class="sub">Preinscripciones, cupos, asignaciones, pagos y contratos en un solo portal.</p><div class="actions"><button class="btn" onclick="showDirectorLogin()">Ingresar como director</button><button class="btn ghost" onclick="showDirectorCreate()">Crear usuario de director</button></div></div><div class="heroImg"><svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="500" fill="#f7fbff"/><rect x="95" y="165" width="610" height="235" rx="10" fill="#fff" stroke="#bfd7ee" stroke-width="8"/><path d="M65 170L400 55l335 115" fill="#dbeafe" stroke="#94a3b8" stroke-width="8"/><rect x="150" y="220" width="125" height="115" rx="6" fill="#e0f2fe"/><rect x="338" y="220" width="125" height="115" rx="6" fill="#fef3c7"/><rect x="525" y="220" width="125" height="115" rx="6" fill="#dcfce7"/><circle cx="400" cy="390" r="34" fill="#f59e0b"/><path d="M365 390h70M400 355v70" stroke="#fff" stroke-width="8"/><circle cx="210" cy="125" r="35" fill="#93c5fd"/><circle cx="590" cy="125" r="35" fill="#86efac"/><path d="M210 165v35M590 165v35" stroke="#64748b" stroke-width="10"/></svg></div></section>`}
function showDirectorLogin(){modal(`<h2>Ingresar como director</h2><p class="sub">Usa el correo y contraseña de tu cuenta.</p><div class="formrow"><div class="field full"><label>Correo electrónico</label><input id="loginEmail" type="email"></div><div class="field full"><label>Contraseña</label><input id="loginPass" type="password"></div></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="loginDirector()">Ingresar</button><button class="btn ghost" onclick="showDirectorCreate()">Crear usuario</button><button class="btn ghost" onclick="resetPass()">Olvidé mi contraseña</button></div><p id="loginMsg"></p>`)}
window.showDirectorLogin=showDirectorLogin;
function showDirectorCreate(){modal(`<h2>Crear usuario de director</h2><p class="sub">La cuenta se asociará al liceo mediante su enlace de director.</p><div class="formrow"><div class="field"><label>Nombre del director</label><input id="regName"></div><div class="field"><label>Correo electrónico</label><input id="regEmail" type="email"></div><div class="field"><label>Contraseña</label><input id="regPass" type="password" minlength="6"></div><div class="field"><label>Confirmar contraseña</label><input id="regPass2" type="password"></div><div class="field full"><label>ID del liceo</label><input id="regLiceo" value="${esc(liceoId||'')}" placeholder="Se toma del enlace del liceo"></div></div><div class="actions"><button class="btn" onclick="registerDirector()">Crear cuenta</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div><p id="regMsg"></p>`)}window.showDirectorCreate=showDirectorCreate; window.logout=()=>signOut(auth).then(()=>location.href=location.pathname);
window.loginDirector=async()=>{const m=document.getElementById('loginMsg');try{const c=await signInWithEmailAndPassword(auth,document.getElementById('loginEmail').value.trim(),document.getElementById('loginPass').value);closeModal();await routeAfterAuth(c.user)}catch(e){m.innerHTML=notice('No se pudo iniciar sesión. Verifica tus datos.','err')}};
window.registerDirector=async()=>{const m=document.getElementById('regMsg'),lid=document.getElementById('regLiceo').value.trim();if(!lid||document.getElementById('regPass').value!==document.getElementById('regPass2').value){m.innerHTML=notice('Completa el liceo y confirma correctamente la contraseña.','warn');return}try{const u=await createUserWithEmailAndPassword(auth,document.getElementById('regEmail').value.trim(),document.getElementById('regPass').value);await setDoc(doc(db,'usuarios',u.user.uid),{uid:u.user.uid,nombre:document.getElementById('regName').value.trim(),email:u.user.email,rol:'director',liceoId:lid,creado:Date.now()});await audit(lid,'Creación de usuario',{rol:'director',email:u.user.email});closeModal();await routeAfterAuth(u.user)}catch(e){m.innerHTML=notice(e.code==='auth/email-already-in-use'?'Ese correo ya tiene una cuenta.':'No se pudo crear la cuenta.','err')}};
window.resetPass=async()=>{const email=document.getElementById('loginEmail')?.value.trim();if(!email)return alert('Escribe primero tu correo.');try{await sendPasswordResetEmail(auth,email);alert('Se envió el enlace para restablecer la contraseña.')}catch(e){alert('No se pudo enviar el enlace.')}};

async function routeAfterAuth(user){if(!user)return;const u=await getDoc(doc(db,'usuarios',user.uid));if(!u.exists()){await signOut(auth);portalHome();return}const d=u.data();if(d.rol==='director'&&d.liceoId){location.href=location.pathname+'?liceo='+encodeURIComponent(d.liceoId)+'&mode=director';}else{portalHome()}}

async function renderPublic(id,data){who.textContent='Preinscripción pública';const refL=doc(db,'liceos',id);let current=data;onSnapshot(refL,s=>{if(s.exists()){current=s.data();if(document.getElementById('p-grado'))updateAvailability(current)}});const cupos=current.cupos||[];app.innerHTML=`<div class="hero"><div><div class="pill">Preinscripción</div><h1>${esc(current.nombre)}</h1><p class="sub">Completa la solicitud. La disponibilidad se actualiza con los cupos configurados por el liceo.</p></div><div class="heroImg"><svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg"><rect width="600" height="340" fill="#f7fbff"/><circle cx="300" cy="130" r="70" fill="#fde68a"/><rect x="170" y="205" width="260" height="70" rx="12" fill="#dbeafe"/><path d="M215 205v70M385 205v70" stroke="#60a5fa" stroke-width="10"/><circle cx="230" cy="120" r="28" fill="#93c5fd"/><circle cx="370" cy="120" r="28" fill="#86efac"/></svg></div></div><div class="section"><h2>Formulario de preinscripción</h2><form id="preform"><div class="formrow"><div class="field"><label>Nombre del estudiante *</label><input id="p-nombre" required></div><div class="field"><label>Apellidos del estudiante *</label><input id="p-apellidos" required></div><div class="field"><label>Cédula del estudiante</label><input id="p-cedula"></div><div class="field"><label>Fecha de nacimiento</label><input id="p-fecha" type="date"></div><div class="field"><label>Cédula del representante *</label><input id="p-cedRep" required></div><div class="field"><label>Parentesco *</label><input id="p-parentesco" required></div><div class="field"><label>Teléfono *</label><input id="p-tel" required></div><div class="field"><label>Correo electrónico</label><input id="p-email" type="email"></div><div class="field full"><label>Dirección</label><input id="p-direccion"></div><div class="field"><label>Grado o nivel solicitado *</label>${gradePicker('p-grado')}</div><div class="field"><label>Turno solicitado *</label><select id="p-turno"><option value="">Selecciona</option><option>Mañana</option><option>Tarde</option><option>Noche</option></select></div><div class="field full"><label><input id="p-any" type="checkbox" style="width:auto"> Cualquier turno disponible</label></div><div class="field full"><label>Información adicional</label><textarea id="p-info" rows="3"></textarea></div><div class="field"><label>Documentos requeridos</label><input id="p-docs" type="file" multiple></div><div class="field"><label>Comprobantes cuando corresponda</label><input id="p-comps" type="file" multiple></div></div><p id="avail"></p><button class="btn" type="submit">Enviar preinscripción</button><p id="pubMsg"></p></form></div>`;document.getElementById('p-grado').onchange=()=>updateAvailability(current);document.getElementById('p-turno').onchange=()=>updateAvailability(current);document.getElementById('p-any').onchange=()=>updateAvailability(current);document.getElementById('preform').onsubmit=async e=>{e.preventDefault();const grado=document.getElementById('p-grado').value,turno=document.getElementById('p-turno').value,any=document.getElementById('p-any').checked;const chosen=pickTurn(current,grado,turno,any);if(!chosen){document.getElementById('pubMsg').innerHTML=notice('No hay cupos disponibles para el grado y turno seleccionados. Para obtener más información, debe dirigirse al liceo y consultar con la dirección.','warn');return}const f=Array.from(document.getElementById('p-docs').files),c=Array.from(document.getElementById('p-comps').files);try{const docs=[];for(const x of f)docs.push({nombre:x.name,url:await uploadFile(x,'preinscripciones/'+id+'/documentos')});const comps=[];for(const x of c)comps.push({nombre:x.name,url:await uploadFile(x,'preinscripciones/'+id+'/comprobantes')});const code='PRE-'+Date.now().toString(36).toUpperCase();const obj={liceoId:id,nombre:document.getElementById('p-nombre').value.trim(),apellidos:document.getElementById('p-apellidos').value.trim(),nino:(document.getElementById('p-nombre').value.trim()+' '+document.getElementById('p-apellidos').value.trim()).trim(),cedulaEstudiante:document.getElementById('p-cedula').value.trim(),fechaNacimiento:document.getElementById('p-fecha').value,cedulaRepresentante:document.getElementById('p-cedRep').value.trim(),parentesco:document.getElementById('p-parentesco').value.trim(),representante:document.getElementById('p-parentesco').value.trim(),telefono:document.getElementById('p-tel').value.trim(),correo:document.getElementById('p-email').value.trim(),direccion:document.getElementById('p-direccion').value.trim(),grado,turnoSolicitado:turno,turnoPreferido:turno,cualquierTurno:any,informacionAdicional:document.getElementById('p-info').value.trim(),documentos:docs,comprobantes:comps,estado:'Pendiente',asignacionEstado:'Pendiente de asignación',creado:Date.now(),codigo:code,reglaTurno:any?'Primer turno con cupo':'Turno solicitado'};const d=await addDoc(collection(db,'preinscripciones'),obj);showReceipt({...obj,id:d.id},current);await audit(id,'Creación de preinscripción',{codigo:code});document.getElementById('preform').reset()}catch(err){document.getElementById('pubMsg').innerHTML=notice('No se pudo enviar la solicitud. Intenta de nuevo.','err')}}}
function pickTurn(data,grado,turno,any){const arr=(data.cupos||[]).filter(c=>c.grado===grado);if(!arr.length)return null;const eligible=arr.filter(c=>Number(c.total||c.capacidad||0)-Number(c.ocupados||0)>0);if(any)return eligible[0]||null;return eligible.find(c=>(c.turno||'')===turno)||null}
function updateAvailability(data){const g=document.getElementById('p-grado')?.value,t=document.getElementById('p-turno')?.value,any=document.getElementById('p-any')?.checked,el=document.getElementById('avail');if(!el||!g)return;const rows=(data.cupos||[]).filter(c=>c.grado===g);if(!rows.length){el.innerHTML=notice('No hay cupos configurados para este grado.','warn');return}el.innerHTML=rows.map(c=>{const n=Math.max(Number(c.total||c.capacidad||0)-Number(c.ocupados||0),0),state=n?'':'<span class="badge red">Agotado</span>';return `<div>${esc(c.turno||'Turno')}: <b>${n}</b> cupos disponibles ${state}</div>`}).join('')+(any?notice('Cualquier turno disponible: el sistema asignará automáticamente el primer turno con cupo.','info'):'');if(!any&&t&&!rows.some(c=>(c.turno||'')===t&&(Number(c.total||c.capacidad||0)-Number(c.ocupados||0)>0)))el.innerHTML+=notice('El turno seleccionado no tiene cupo real disponible.','warn')}
function showReceipt(p,l){modal(`<div class="contract"><div class="contractHead"><h2>Cupo-Online</h2><div>COMPROBANTE DE PREINSCRIPCIÓN</div><strong>${esc(p.codigo)}</strong></div><p><b>Liceo:</b> ${esc(l.nombre)}</p><p><b>Estudiante:</b> ${esc(p.nino)}</p><p><b>Cédula:</b> ${esc(p.cedulaEstudiante||'—')}</p><p><b>Representante:</b> ${esc(p.cedulaRepresentante)} · ${esc(p.parentesco)}</p><p><b>Teléfono:</b> ${esc(p.telefono)}</p><p><b>Grado/nivel:</b> ${esc(p.grado)}</p><p><b>Turno solicitado:</b> ${esc(p.turnoSolicitado||'—')}</p><p><b>Sección:</b> Pendiente de asignación</p><p><b>Salón:</b> Pendiente de asignación</p><p><b>Estado:</b> Pendiente</p><p><b>Fecha:</b> ${dateText(p.creado)}</p></div><div class="actions noPrint"><button class="btn" onclick="window.print()">Imprimir / Guardar PDF</button><button class="btn ghost" onclick="closeModal()">Cerrar</button></div>`)}

async function renderDirector(id){const u=auth.currentUser;who.textContent='Director';const uDoc=await getDoc(doc(db,'usuarios',u.uid));if(!uDoc.exists()||uDoc.data().liceoId!==id){app.innerHTML=notice('Esta cuenta no está autorizada para este liceo.','err');return}let liceo={};let pre=[];let pagos=[];let contratos=[];onSnapshot(doc(db,'liceos',id),s=>{if(s.exists()){liceo=s.data();paint()}});onSnapshot(query(collection(db,'preinscripciones'),where('liceoId','==',id)),s=>{pre=s.docs.map(x=>({id:x.id,data:x.data()}));paint()});onSnapshot(query(collection(db,'pagosRepresentantes'),where('liceoId','==',id)),s=>{pagos=s.docs.map(x=>({id:x.id,data:x.data()}));paint()});onSnapshot(query(collection(db,'contratos'),where('liceoId','==',id)),s=>{contratos=s.docs.map(x=>({id:x.id,data:x.data()}));paint()});function paint(){app.innerHTML=`<h1 class="page">${esc(liceo.nombre||'Liceo')}</h1><p class="sub">Panel del director</p><div class="actions noPrint"><button class="btn ghost" onclick="sharePublic('${id}')">Compartir preinscripción</button><button class="btn ghost" onclick="showQR('${id}')">Mostrar QR</button><button class="btn ghost" onclick="logout()">Cerrar sesión</button></div><div class="section"><h2>Resumen</h2><div class="grid"><div class="card"><b>${pre.length}</b><span>preinscripciones</span></div><div class="card"><b>${pre.filter(x=>x.data.estado==='Aceptada'||x.data.estado==='confirmada').length}</b><span>aceptadas</span></div><div class="card"><b>${pagos.filter(x=>x.data.estado==='Aprobado').length}</b><span>pagos aprobados</span></div><div class="card"><b>${contratos.length}</b><span>contratos</span></div></div></div><div class="section"><h2>Cupos por grado, turno, salón y sección</h2>${capacityEditor(liceo,id)}</div><div class="section"><h2>Preinscripciones recibidas</h2>${preTable(pre)}</div><div class="section"><h2>Pagos de representantes</h2>${repPayments(pagos)}</div><div class="section"><h2>Mensualidad de la plataforma</h2>${platformPayment(liceo,id)}</div><div class="section"><h2>Contrato del liceo</h2>${contractDirector(contratos,id)}</div><div class="section"><h2>Registrar preinscripción manual</h2>${manualPre(id)}</div>`}window.__refreshDirector=paint}
function capacityEditor(l,id){const rows=l.cupos||[];return `<p class="small">El director puede corregir los cupos. Las secciones se asignan automáticamente al aceptar una solicitud.</p><table><thead><tr><th>Grado</th><th>Turno</th><th>Salón</th><th>Sección</th><th>Capacidad</th><th>Ocupados</th><th>Disponibles</th><th></th></tr></thead><tbody>${rows.map((c,i)=>`<tr><td>${esc(c.grado)}</td><td>${esc(c.turno||'')}</td><td>${esc(c.salon||'')}</td><td>${esc(c.seccion||'')}</td><td>${c.total||c.capacidad||0}</td><td>${c.ocupados||0}</td><td>${Math.max((c.total||c.capacidad||0)-(c.ocupados||0),0)}</td><td><button class="btn sm ghost" onclick="editCapacity('${id}',${i})">Editar</button></td></tr>`).join('')}</tbody></table><div class="card" style="margin-top:12px"><div class="formrow"><div class="field"><label>Grado</label>${gradePicker('cgrado')}</div><div class="field"><label>Turno</label><select id="cturno"><option>Mañana</option><option>Tarde</option><option>Noche</option></select></div><div class="field"><label>Salón</label><input id="csalon"></div><div class="field"><label>Sección</label><input id="cseccion" placeholder="A"></div><div class="field"><label>Capacidad</label><input id="ccap" type="number" min="0"></div></div><button class="btn sm" onclick="addCapacity('${id}')">+ Agregar / actualizar cupo</button></div>`}
window.addCapacity=async id=>{const d={grado:document.getElementById('cgrado').value,turno:document.getElementById('cturno').value,salon:document.getElementById('csalon').value.trim(),seccion:document.getElementById('cseccion').value.trim(),capacidad:Number(document.getElementById('ccap').value||0),total:Number(document.getElementById('ccap').value||0)};const s=await getDoc(doc(db,'liceos',id));const a=s.data().cupos||[];const ix=a.findIndex(x=>x.grado===d.grado&&x.turno===d.turno&&x.salon===d.salon&&x.seccion===d.seccion);if(ix>=0)d.ocupados=a[ix].ocupados||0;const next=ix>=0?a.map((x,i)=>i===ix?{...x,...d}:x):[...a,d];await updateDoc(doc(db,'liceos',id),{cupos:next});await audit(id,'Cambio de cupos',d)};
window.editCapacity=async(id,i)=>{const s=await getDoc(doc(db,'liceos',id)),a=s.data().cupos||[],c=a[i];modal(`<h2>Editar cupo</h2><div class="formrow"><div class="field"><label>Capacidad</label><input id="ecap" type="number" value="${c.total||c.capacidad||0}"></div></div><div class="actions"><button class="btn" onclick="saveCapacity('${id}',${i})">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)};window.saveCapacity=async(id,i)=>{const s=await getDoc(doc(db,'liceos',id)),a=s.data().cupos||[];a[i].total=Number(document.getElementById('ecap').value||0);a[i].capacidad=a[i].total;await updateDoc(doc(db,'liceos',id),{cupos:a});await audit(id,'Cambio de capacidad',{indice:i,nuevo:a[i].total});closeModal()};
function preTable(rows){if(!rows.length)return '<div class="empty">No hay preinscripciones.</div>';return `<table><thead><tr><th>Estudiante</th><th>Grado</th><th>Turno</th><th>Asignación</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${rows.sort((a,b)=>(b.data.creado||0)-(a.data.creado||0)).map(p=>`<tr><td><b>${esc(p.data.nino)}</b><br><span class="small">${esc(p.data.representante||p.data.cedulaRepresentante||'')}</span></td><td>${esc(p.data.grado)}</td><td>${esc(p.data.turnoSolicitado||p.data.turno||'—')}</td><td>${p.data.asignacion?esc(p.data.asignacion.seccion)+' · '+esc(p.data.asignacion.salon):'<span class="small">Pendiente</span>'}</td><td><span class="badge ${p.data.estado==='Aceptada'?'green':p.data.estado==='Rechazada'?'red':'gray'}">${esc(p.data.estado||'Pendiente')}</span></td><td><div class="actions"><button class="btn sm green" onclick="acceptPre('${p.id}','${esc(p.data.liceoId)}')">Aceptar</button><button class="btn sm ghost" onclick="changePre('${p.id}','Devolver para corregir')">Devolver</button><button class="btn sm red" onclick="changePre('${p.id}','Rechazada')">Rechazar</button></div></td></tr>`).join('')}</tbody></table>`}
window.changePre=async(pid,state)=>{const reason=state==='Rechazada'?prompt('Motivo de rechazo:'):'';if(state==='Rechazada'&&!reason)return;await updateDoc(doc(db,'preinscripciones',pid),{estado:state,observaciones:reason||'',revisadoPor:auth.currentUser.email,revisadoEn:Date.now()});await audit(liceoId,'Cambio de estado de preinscripción',{pid,state,reason})};
window.acceptPre=async(pid,id)=>{const p=await getDoc(doc(db,'preinscripciones',pid));if(!p.exists())return;const x=p.data();const l=await getDoc(doc(db,'liceos',id));const data=l.data(),rows=data.cupos||[];let candidates=rows.map((c,i)=>({...c,i})).filter(c=>c.grado===x.grado&&(x.cualquierTurno||!x.turnoSolicitado||c.turno===x.turnoSolicitado)&&Number(c.total||c.capacidad||0)-Number(c.ocupados||0)>0);if(x.cualquierTurno)candidates.sort((a,b)=>(a.ocupados||0)-(b.ocupados||0));const c=candidates[0];if(!c){await updateDoc(doc(db,'preinscripciones',pid),{estado:'Pendiente de asignación'});alert('No hay cupos disponibles para asignar automáticamente.');return}rows[c.i].ocupados=(rows[c.i].ocupados||0)+1;const asig={grado:x.grado,turno:c.turno,salon:c.salon,seccion:c.seccion,anioEscolar:data.anioEscolar||new Date().getFullYear(),fechaHora:Date.now(),reglaUtilizada:x.cualquierTurno?'Primer turno con cupo':'Menos ocupados dentro del turno solicitado',estado:'Asignada',usuarioProceso:auth.currentUser.email};await updateDoc(doc(db,'liceos',id),{cupos:rows});await updateDoc(doc(db,'preinscripciones',pid),{estado:'Aceptada',asignacionEstado:'Asignada',asignacion:asig,fechaAceptacion:Date.now(),revisadoPor:auth.currentUser.email});await audit(id,'Asignación automática',{estudiante:x.nino,asignacion:asig});alert('Solicitud aceptada y sección asignada automáticamente.')};
function manualPre(id){return `<div class="card"><div class="formrow"><div class="field"><label>Nombre del estudiante</label><input id="mn"></div><div class="field"><label>Grado</label>${gradePicker('mg')}</div><div class="field"><label>Representante</label><input id="mr"></div><div class="field"><label>Teléfono</label><input id="mt"></div></div><button class="btn sm" onclick="manualAdd('${id}')">Registrar</button></div>`}window.manualAdd=async id=>{await addDoc(collection(db,'preinscripciones'),{liceoId:id,nino:document.getElementById('mn').value.trim(),grado:document.getElementById('mg').value,representante:document.getElementById('mr').value.trim(),telefono:document.getElementById('mt').value.trim(),estado:'Pendiente',asignacionEstado:'Pendiente de asignación',creado:Date.now(),origen:'manual'});await audit(id,'Creación de estudiante/preinscripción manual');alert('Registrado')};
function repPayments(rows){if(!rows.length)return '<div class="empty">No hay pagos registrados.</div>';return `<table><thead><tr><th>Estudiante</th><th>Concepto</th><th>Monto</th><th>Vencimiento</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${rows.map(p=>{const d=p.data;return `<tr><td>${esc(d.estudiante)}</td><td>${esc(d.concepto)}</td><td>${money(d.monto)}</td><td>${esc(d.fechaVencimiento||'—')}</td><td>${paymentBadge(d)}</td><td>${d.estado==='En revisión'||d.estado==='Comprobante enviado'?`<button class="btn sm green" onclick="approveRepPay('${p.id}')">Aprobar</button><button class="btn sm red" onclick="rejectRepPay('${p.id}')">Rechazar</button>`:''}</td></tr>`}).join('')}</tbody></table>`}
function paymentBadge(d){const venc=d.fechaVencimiento?new Date(d.fechaVencimiento+'T23:59:59'):null,now=new Date(),days=venc?Math.ceil((venc-now)/86400000):999;if(d.estado==='Aprobado')return '<span class="badge green">Aprobado</span>';let a=days<0?'<span class="badge red">Vencido</span>':days<=5?'<span class="badge orange">Por vencer</span>':'';let b=d.estado==='En revisión'||d.estado==='Comprobante enviado'?'<span class="badge blue">'+esc(d.estado)+'</span>':'<span class="badge gray">'+esc(d.estado||'Pendiente')+'</span>';return a+b}
window.approveRepPay=async id=>{await updateDoc(doc(db,'pagosRepresentantes',id),{estado:'Aprobado',usuarioAprobacion:auth.currentUser.email,fechaAprobacion:Date.now()});await audit(liceoId,'Aprobación de pago de representante',{id})};window.rejectRepPay=async id=>{const m=prompt('Motivo de rechazo:');if(!m)return;await updateDoc(doc(db,'pagosRepresentantes',id),{estado:'Rechazado',usuarioAprobacion:auth.currentUser.email,motivoRechazo:m,fechaAprobacion:Date.now()});await audit(liceoId,'Rechazo de pago de representante',{id,motivo:m});alert('Pago rechazado. El representante debe recibir el motivo mediante el mecanismo de notificación configurado.')};
function platformPayment(l,id){const p=l.mensualidadPlataforma||{};return `<div class="card"><p><b>Tarifa inicial:</b> ${money(p.tarifaInicial)}</p><p><b>Mensualidad:</b> ${money(p.mensualidad)}</p><p><b>Vencimiento:</b> ${esc(p.fechaVencimiento||'—')}</p><p><b>Período:</b> ${esc(p.periodoFacturado||'—')}</p><p><b>Estado:</b> <span class="badge gray">${esc(p.estado||'Pendiente')}</span></p><p><b>Período de gracia:</b> ${esc(p.periodoGracia||'—')}</p><button class="btn sm" onclick="payPlatform('${id}')">Pagar mensualidad de la plataforma</button></div>`}window.payPlatform=id=>modal(`<h2>Pagar mensualidad de la plataforma</h2><p class="sub">Este pago es liceo → empresa y está separado de los pagos de representantes → liceo.</p><div class="formrow"><div class="field"><label>Monto</label><input id="platMonto" type="number"></div><div class="field"><label>Método de pago</label><input id="platMetodo"></div><div class="field full"><label>Comprobante</label><input id="platFile" type="file"></div></div><button class="btn" onclick="sendPlatform('${id}')">Enviar comprobante</button>`);window.sendPlatform=async id=>{const f=document.getElementById('platFile').files[0];const url=f?await uploadFile(f,'pagosPlataforma/'+id):null;await updateDoc(doc(db,'liceos',id),{mensualidadPlataforma:{monto:Number(document.getElementById('platMonto').value||0),metodoPago:document.getElementById('platMetodo').value,comprobante:url,estado:'Comprobante enviado',fechaEnvio:Date.now()}});await audit(id,'Comprobante de mensualidad enviado');closeModal();alert('Comprobante enviado para revisión')};
function contractDirector(rows,id){const c=rows[0]?.data;if(!c)return '<div class="empty">No hay contrato emitido todavía.</div>';return `<div class="card"><p><b>${esc(c.numero)}</b> · Versión ${esc(c.version||1)}</p><p>Estado: ${esc(c.estado||'Borrador pendiente de impresión')}</p><p><b>Monto final:</b> ${money(c.montoFinalNegociado)}</p><div class="actions"><button class="btn sm" onclick="viewContract('${rows[0].id}')">Leer contrato</button><button class="btn sm ghost" onclick="printContract('${rows[0].id}')">Imprimir contrato</button><button class="btn sm ghost" onclick="printContract('${rows[0].id}')">Descargar contrato en PDF</button>${c.estado!=='Aceptado'?`<button class="btn sm green" onclick="acceptContract('${rows[0].id}')">Aceptar contrato</button>`:''}</div></div>`}window.viewContract=async id=>{const s=await getDoc(doc(db,'contratos',id));if(s.exists())modal(contractHtml(s.data())+'<div class="actions noPrint"><button class="btn" onclick="printContract(\''+id+'\')">Imprimir contrato</button><button class="btn ghost" onclick="closeModal()">Cerrar</button></div>')};window.printContract=async id=>{const s=await getDoc(doc(db,'contratos',id));if(!s.exists())return;modal(contractHtml(s.data())+'<div class="actions noPrint"><button class="btn" onclick="window.print()">Imprimir / Guardar PDF</button></div>')};window.acceptContract=async id=>{const s=await getDoc(doc(db,'contratos',id));if(!s.exists())return;const c=s.data();if(!confirm('He leído y acepto los términos y condiciones del contrato.'))return;await updateDoc(doc(db,'contratos',id),{estado:'Aceptado',aceptacion:{numero:c.numero,version:c.version,nombreUsuario:auth.currentUser.email,cargo:'Director',liceo:c.liceo?.nombre||'',fechaHora:Date.now(),cuenta:auth.currentUser.uid}});await audit(c.liceoId,'Aceptación digital de contrato',{numero:c.numero,version:c.version});alert('Contrato aceptado digitalmente.');window.__refreshDirector?.()};
function contractHtml(c){return `<div class="contract"><div class="contractHead"><h2>CONTRATO ${esc(c.numero)}</h2><div>Versión ${esc(c.version||1)}</div></div><p><b>Empresa:</b> ${esc(c.empresa?.nombre||'')}</p><p><b>Liceo:</b> ${esc(c.liceo?.nombre||'')}</p><p><b>Tarifa estándar:</b> ${money(c.tarifaEstandar)}</p><p><b>Monto final negociado:</b> ${money(c.montoFinalNegociado)}</p><p><b>Descuento:</b> ${money(c.descuento)}</p>${(c.clausulas||[]).map(x=>`<h3>${esc(x.titulo)}</h3><p>${esc(x.texto)}</p>`).join('')}<p><b>Advertencia:</b> Este documento debe ser revisado por un abogado antes de usarse como contrato legal definitivo.</p></div>`}
function sharePublic(id){const l=publicLink(id);navigator.clipboard?.writeText(l);alert('Enlace público copiado: '+l)}window.sharePublic=sharePublic;window.showQR=id=>modal(`<h2>Compartir preinscripción</h2><p class="sub">Este QR abre únicamente el formulario público.</p><div class="qr"><img src="${qrUrl(publicLink(id))}" alt="Código QR" width="220" height="220"></div><p class="small">${esc(publicLink(id))}</p><div class="actions"><button class="btn" onclick="navigator.clipboard.writeText('${publicLink(id)}');alert('Copiado')">Copiar enlace</button><button class="btn ghost" onclick="window.print()">Imprimir QR</button></div>`)

async function ownerView(){who.textContent='Propietario';let ls=[];let ps=[];onSnapshot(collection(db,'liceos'),s=>{ls=s.docs.map(x=>({id:x.id,data:x.data()}));paint()});onSnapshot(collection(db,'preinscripciones'),s=>{ps=s.docs.map(x=>({id:x.id,data:x.data()}));paint()});function paint(){app.innerHTML=`<h1 class="page">Panel del propietario</h1><p class="sub">Configuración y supervisión de Cupo-Online.</p><div class="grid"><div class="card"><b>${ls.length}</b><span>liceos</span></div><div class="card"><b>${ps.length}</b><span>preinscripciones</span></div></div><div class="section"><h2>Liceos afiliados</h2>${ls.map(l=>`<div class="card" style="margin-bottom:10px"><b>${esc(l.data.nombre)}</b><p class="small">Estado: ${esc(l.data.estado||'Pendiente de revisión')}</p><div class="formrow"><div class="field"><label>Estado del liceo</label><select id="ost-${l.id}"><option>Pendiente de revisión</option><option>En negociación</option><option>Aprobado</option><option>Rechazado</option><option>Pendiente de contrato</option><option>Pendiente de aceptación</option><option>Activo</option><option>Suspendido</option><option>Cancelado</option></select></div><div class="field"><label>Monto final negociado</label><input id="oprice-${l.id}" type="number" value="${Number(l.data.montoFinalNegociado||l.data.mensualidadPlataforma?.mensualidad||0)}"></div></div><div class="linkbox"><code>${esc(publicLink(l.id))}</code><button class="btn sm ghost" onclick="navigator.clipboard.writeText('${publicLink(l.id)}')">Copiar público</button></div><div class="actions" style="margin-top:8px"><button class="btn sm" onclick="editLiceo('${l.id}')">Editar liceo</button><button class="btn sm danger" onclick="deleteLiceo('${l.id}')">Eliminar liceo</button><button class="btn sm" onclick="saveLiceoApproval('${l.id}')">Guardar aprobación</button><button class="btn sm ghost" onclick="createContract('${l.id}')">Generar contrato</button><button class="btn sm ghost" onclick="ownerQR('${l.id}')">QR</button></div></div>`).join('')||'<div class="empty">Aún no hay liceos.</div>'}<div class="card"><div class="formrow"><div class="field full"><label>Nombre del nuevo liceo</label><input id="newL"></div></div><button class="btn" onclick="createLiceo()">+ Crear liceo</button></div></div><div class="section"><h2>Configuración estándar</h2><div class="card"><div class="formrow"><div class="field"><label>Tarifa inicial</label><input id="stdInit" type="number"></div><div class="field"><label>Mensualidad</label><input id="stdMonth" type="number"></div><div class="field"><label>Período de gracia</label><input id="stdGrace"></div></div><button class="btn" onclick="saveStandards()">Guardar tarifas estándar</button></div></div><div class="section"><h2>Auditoría</h2><div class="empty">Los eventos de usuarios, permisos, estudiantes, preinscripciones, asignaciones, pagos, contratos, precios, impresiones, aceptaciones, versiones, suspensiones y cambios del propietario se registran en la colección de auditoría.</div></div>`;ls.forEach(l=>{const e=document.getElementById('ost-'+l.id);if(e)e.value=l.data.estado||'Pendiente de revisión'})}}window.createLiceo=async()=>{const nombre=document.getElementById('newL').value.trim();if(!nombre)return;const r=await addDoc(collection(db,'liceos'),{nombre,estado:'Pendiente de revisión',cupos:[],mensualidadPlataforma:{estado:'Pendiente'},creado:Date.now()});await audit(r.id,'Creación de liceo',{nombre});document.getElementById('newL').value=''};window.saveStandards=async()=>{await setDoc(doc(db,'configuracion','plataforma'),{tarifaInicial:Number(document.getElementById('stdInit').value||0),mensualidad:Number(document.getElementById('stdMonth').value||0),periodoGracia:document.getElementById('stdGrace').value,modificadoPor:'propietario',fecha:Date.now()});await audit(null,'Cambio de tarifas estándar');alert('Tarifas guardadas')};
window.editLiceo=async id=>{const s=await getDoc(doc(db,'liceos',id));if(!s.exists())return;const x=s.data();modal(`<h2>Editar liceo</h2><div class="formrow"><div class="field"><label>Nombre del liceo</label><input id="elNombre" value="${esc(x.nombre||'')}"></div><div class="field"><label>Teléfono</label><input id="elTel" value="${esc(x.telefono||'')}"></div><div class="field"><label>Correo</label><input id="elEmail" value="${esc(x.email||'')}"></div><div class="field full"><label>Dirección</label><input id="elDir" value="${esc(x.direccion||'')}"></div><div class="field full"><label>Presentación del liceo</label><textarea id="elDesc">${esc(x.descripcion||'')}</textarea></div><div class="field full"><label>Foto o logo del liceo</label><input id="elFoto" type="file" accept="image/*"></div></div><div class="actions"><button class="btn" onclick="saveLiceoEdit('${id}')">Guardar cambios</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)};
window.saveLiceoEdit=async id=>{const f=document.getElementById('elFoto')?.files[0];let foto=null;if(f)foto=await uploadFile(f,'liceos/'+id+'/perfil');const old=(await getDoc(doc(db,'liceos',id))).data()||{};const changes={nombre:document.getElementById('elNombre').value.trim(),telefono:document.getElementById('elTel').value.trim(),email:document.getElementById('elEmail').value.trim(),direccion:document.getElementById('elDir').value.trim(),descripcion:document.getElementById('elDesc').value.trim(),actualizado:Date.now()};if(foto)changes.fotoPerfil=foto;await updateDoc(doc(db,'liceos',id),changes);await audit(id,'Edición de liceo',{anterior:old,nuevo:changes});closeModal();alert('Liceo actualizado correctamente')};
window.deleteLiceo=async id=>{const s=await getDoc(doc(db,'liceos',id));if(!s.exists())return;const n=s.data().nombre||id;if(!confirm('Vas a eliminar el liceo '+n+'. Esta acción no se puede deshacer desde la página. ¿Continuar?'))return;await deleteDoc(doc(db,'liceos',id));await audit(id,'Eliminación de liceo',{nombre:n});alert('Liceo eliminado')};

window.saveLiceoApproval=async id=>{const estado=document.getElementById('ost-'+id).value,monto=Number(document.getElementById('oprice-'+id).value||0);const old=await getDoc(doc(db,'liceos',id));const prev=old.data()||{};await updateDoc(doc(db,'liceos',id),{estado,montoFinalNegociado:monto,tarifaEstandar:prev.tarifaEstandar||0,descuento:Number(prev.tarifaEstandar||0)-monto});await audit(id,'Aprobación/negociación individual de liceo',{estado,monto,anterior:prev.montoFinalNegociado||0});alert('Condiciones guardadas')};
window.createContract=async id=>{const l=await getDoc(doc(db,'liceos',id));if(!l.exists())return;const ld=l.data();const counter=doc(db,'configuracion','contadorContratos');const num=await runTransaction(db,async tx=>{const s=await tx.get(counter);const n=(s.exists()?Number(s.data().ultimo||0):0)+1;tx.set(counter,{ultimo:n},{merge:true});return 'CONTRATO-'+String(n).padStart(6,'0')});const clauses=[['Servicios incluidos','Servicios incluidos según las condiciones aprobadas para el liceo.'],['Reglas de cupos y asignación','Los cupos, asignaciones automáticas y asignaciones excepcionales se regirán por la configuración y reglas de la plataforma.'],['Protección de datos','La información privada estará disponible únicamente para usuarios autorizados y se gestionará conforme a las políticas aplicables.'],['Seguridad y uso permitido','El uso de la plataforma queda limitado a los fines administrativos y educativos autorizados.'],['Propiedad intelectual','Los contenidos y componentes de la plataforma pertenecen a sus respectivos titulares.'],['Notificaciones','Las notificaciones se enviarán mediante los canales configurados en la plataforma.'],['Responsabilidades','Cada parte cumplirá las responsabilidades y condiciones acordadas.'],['Suspensión y terminación','La suspensión y terminación se aplicarán según las condiciones aprobadas y el contrato.'],['Jurisdicción','La jurisdicción aplicable será la establecida en la versión final del contrato.']];const c={numero:num,version:1,estado:'Borrador pendiente de impresión',liceoId:id,empresa:{nombre:'Cupo-Online'},liceo:{nombre:ld.nombre},tarifaEstandar:Number(ld.tarifaEstandar||0),montoFinalNegociado:Number(ld.montoFinalNegociado||ld.mensualidadPlataforma?.mensualidad||0),descuento:Number(ld.descuento||0),serviciosIncluidos:ld.serviciosIncluidos||[],fechaInicio:ld.fechaInicio||'',duracion:ld.duracion||'',renovacion:ld.renovacion||'',metodoPago:ld.mensualidadPlataforma?.metodoPago||'',periodoGracia:ld.mensualidadPlataforma?.periodoGracia||'',vencimiento:ld.mensualidadPlataforma?.fechaVencimiento||'',clausulas:clauses.map(x=>({titulo:x[0],texto:x[1]})),creado:Date.now(),creadoPor:auth.currentUser?.email||'propietario',historial:[{version:1,estado:'Borrador pendiente de impresión',fecha:Date.now(),usuario:auth.currentUser?.email||'propietario'}]};await addDoc(collection(db,'contratos'),c);await updateDoc(doc(db,'liceos',id),{estado:'Pendiente de aceptación'});await audit(id,'Creación de contrato',{numero:num,version:1});alert('Contrato '+num+' creado')};
window.ownerQR=id=>modal(`<h2>QR de preinscripción pública</h2><div class="qr"><img src="${qrUrl(publicLink(id))}" width="220" height="220"></div><p class="small">${esc(publicLink(id))}</p><button class="btn" onclick="window.print()">Imprimir QR</button>`);
async function boot(){if(!liceoId){await ownerView();return}const ld=await getDoc(doc(db,'liceos',liceoId));if(!ld.exists()){app.innerHTML=notice('Ese liceo no existe.','err');return}if(mode==='director'){onAuthStateChanged(auth,u=>{if(u)renderDirector(liceoId);else{who.textContent='Acceso de director';app.innerHTML=`<div class="hero"><div><div class="pill">${esc(ld.data().nombre)}</div><h1>Panel del director</h1><p class="sub">Inicia sesión o crea tu usuario para entrar.</p><div class="actions"><button class="btn" onclick="showDirectorLogin()">Ingresar</button><button class="btn ghost" onclick="showDirectorCreate()">Crear usuario</button></div></div><div class="heroImg"><svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg"><rect width="600" height="340" fill="#f7fbff"/><path d="M80 270h440M120 270V120h360v150" stroke="#64748b" stroke-width="12" fill="#fff"/><path d="M100 120l200-80 200 80" fill="#dbeafe" stroke="#64748b" stroke-width="12"/><circle cx="180" cy="200" r="28" fill="#93c5fd"/><circle cx="300" cy="200" r="28" fill="#fde68a"/><circle cx="420" cy="200" r="28" fill="#86efac"/></svg></div></div>`}})}else renderPublic(liceoId,ld.data())}
boot();
</script>
</body></html>
